version: 2
updates:
  # npm dependencies (frontend, circuits, scripts)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    groups:
      dev-dependencies:
        applies-to: "development"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    allow:
      - dependency-type: "development"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
      - "npm"

  # Python dependencies (scripts, analysis tools)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    groups:
      dev-dependencies:
        applies-to: "development"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
      - "python"

  # Docker dependencies (ci containers, base images)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    groups:
      base-images:
        patterns:
          - "*"
        update-types:
          - "patch"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
      - "github-actions"