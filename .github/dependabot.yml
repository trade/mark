# .github/dependabot.yml
# Minimal Dependabot configuration: pulls new patch/minor npm changes weekly.
# Adjust schedule or add more ecosystems as required.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      node: &node
        patterns:
          - "*"
    labels:
      - "security"
