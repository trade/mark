version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'npm'
    directory: '/circuits'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:45'
      timezone: 'UTC'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'circuits'
      - 'security'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:30'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'frontend'
      - 'security'
    allow:
      - dependency-type: 'direct'
      - dependency-type: 'indirect'
    groups:
      frontend-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # Transitive deps from @eth-optimism/super-cli (dev/deploy tool, not runtime).
      # No upstream fix available — re-evaluate when super-cli bumps these packages.
      - dependency-name: '@hono/node-server'
        versions: ['<= 1.13.8']
      - dependency-name: 'drizzle-orm'
        versions: ['<= 0.38.4']
      - dependency-name: '@stablelib/ed25519'
        versions: ['<= 1.0.3']
