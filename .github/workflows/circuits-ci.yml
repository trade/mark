name: Circuits CI

on:
  pull_request:
  push:
    branches:
      - main
      - canary
      - dev

jobs:
  circuits-test:
    name: Circuits Witness Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuits

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install circom
        run: |
          curl -L https://github.com/iden3/circom/releases/latest/download/circom-linux-amd64 -o circom
          chmod +x circom
          sudo mv circom /usr/local/bin/circom

      - name: Install dependencies
        run: npm ci

      - name: Run witness tests
        run: npm test
