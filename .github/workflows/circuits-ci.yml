name: Circuits CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  circuits-test:
    name: Circuits Witness Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: circuits

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'

      - name: Setup pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.2 --activate

      - name: Install circom
        run: |
          CIRCOM_VERSION="v2.2.3"
          CIRCOM_URL="https://github.com/iden3/circom/releases/download/${CIRCOM_VERSION}/circom-linux-amd64"
          curl -sSL "$CIRCOM_URL" -o /tmp/circom
          echo '85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3  /tmp/circom' | sha256sum -c -
          sudo install -m 755 /tmp/circom /usr/local/bin/circom
          circom --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run witness tests
        run: pnpm test
