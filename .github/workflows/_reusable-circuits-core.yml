name: Reusable Circuits Core

on:
  workflow_call:
    inputs:
      run_tests:
        description: 'Run circuit tests'
        required: false
        default: 'true'
        type: string
      run_circomspect:
        description: 'Run circomspect static analysis'
        required: false
        default: 'true'
        type: string

jobs:
  circuits-core:
    name: Circuits Core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Setup mise
        uses: jdx/mise-action@691e684984939740113c1a3ae421e8a58f5b33cb # v2.0.0
        with:
          install: true
          cache: true

      - name: Setup toolchain
        run: mise install

      - name: Install circom
        run: |
          CIRCOM_VERSION="v2.2.3"
          curl -sSL "https://github.com/iden3/circom/releases/download/${CIRCOM_VERSION}/circom-linux-amd64" -o /tmp/circom
          echo '85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3  /tmp/circom' | sha256sum -c -
          sudo install -m 755 /tmp/circom /usr/local/bin/circom
          circom --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile circuits
        run: |
          cd circuits
          mkdir -p build
          pnpm run build

      - name: Run circuit tests
        if: ${{ inputs.run_tests == 'true' }}
        run: |
          cd circuits
          pnpm test

      - name: Install circomspect
        if: ${{ inputs.run_circomspect == 'true' }}
        run: cargo install circomspect --version 0.9.0 --locked

      - name: Run circomspect
        if: ${{ inputs.run_circomspect == 'true' }}
        run: |
          circomspect circuits/ \
            -l ERROR \
            -L node_modules/.pnpm/circomlib@2.0.5/node_modules