name: Reusable Circuits Core

on:
  workflow_call:
    inputs:
      run_tests:
        description: 'Run circuit tests'
        required: false
        default: 'true'
        type: string
      run_circomspect:
        description: 'Run circomspect static analysis'
        required: false
        default: 'true'
        type: string

permissions:
  contents: read

jobs:
  circuits-core:
    name: Circuits Core
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true

      - name: Setup toolchain
        run: mise install

      - name: Install circom
        run: |
          CIRCOM_VERSION="v2.2.3"
          CIRCOM_SHA256="85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3"
          curl -sSL "https://github.com/iden3/circom/releases/download/${CIRCOM_VERSION}/circom-linux-amd64" -o /tmp/circom
          echo "${CIRCOM_SHA256}  /tmp/circom" | sha256sum -c -
          sudo install -m 755 /tmp/circom /usr/local/bin/circom
          circom --version

      - name: Cache circom binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /usr/local/bin/circom
          key: circom-${{ hashFiles('**/circom-version.txt') }}-${{ runner.os }}
          restore-keys: |
            circom-v2.2.3-

      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile circuits
        run: |
          cd circuits
          mkdir -p build
          pnpm run build

      - name: Run circuit tests
        if: ${{ inputs.run_tests == 'true' }}
        run: |
          cd circuits
          pnpm test

      - name: Install circomspect
        if: ${{ inputs.run_circomspect == 'true' }}
        run: cargo install circomspect --version 0.9.0 --locked

      - name: Run circomspect
        if: ${{ inputs.run_circomspect == 'true' }}
        run: |
          circomspect circuits/ \
            -l ERROR \
            -L node_modules/.pnpm/circomlib@2.0.5/node_modules