name: Reusable Circuits Core

on:
  workflow_call:
    inputs:
      run_tests:
        description: 'Run circuit tests'
        required: false
        default: 'true'
        type: string
      run_circomspect:
        description: 'Run circomspect static analysis'
        required: false
        default: 'true'
        type: string

permissions:
  contents: read

jobs:
  circuits-core:
    name: Circuits Core
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-circom: 'true'
          install-circomspect: ${{ inputs.run_circomspect }}
          cache-key-suffix: circuits

      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile circuits
        run: |
          cd circuits
          mkdir -p build
          pnpm run build

      - name: Run circuit tests
        if: ${{ inputs.run_tests == 'true' }}
        run: |
          cd circuits
          pnpm test

      - name: Run circomspect
        if: ${{ inputs.run_circomspect == 'true' }}
        run: |
          circomspect circuits/ \
            -l ERROR \
            -L node_modules/.pnpm/circomlib@2.0.5/node_modules