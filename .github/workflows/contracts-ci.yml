name: Contracts CI

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-ci.yml"
  push:
    branches:
      - main
      - canary
      - dev
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-ci.yml"
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run integration tests against local supersim endpoints (127.0.0.1:9545/9546)"
        required: false
        default: false
        type: boolean

jobs:
  contracts-unit-invariant:
    name: Contracts Unit + Invariant
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Enforce architecture boundaries
        run: make architecture-guard

      - name: Enforce test/script layering boundaries
        run: make layering-guard

      - name: Run deterministic test suite
        run: forge test -vv

      - name: Run production lock invariants
        run: make test-production-lock

  contracts-release-check:
    name: Contracts Release Check (Dry-Run + Execute Smoke)
    runs-on: ubuntu-latest
    needs: contracts-unit-invariant
    defaults:
      run:
        working-directory: contracts
    env:
      PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      RPC_URL: http://127.0.0.1:8545
      MARK_RELEASE_EXECUTE: "false"
      MARK_RELEASE_RUN_POSTDEPLOY: "false"
      MARK_RELEASE_WRITE_ARTIFACT: "false"
      MARK_GIT_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Start anvil
        run: anvil --host 127.0.0.1 --port 8545 > /tmp/anvil.log 2>&1 &

      - name: Wait for anvil readiness
        run: |
          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 8545; then
              exit 0
            fi
            sleep 1
          done
          echo "anvil did not become ready on 127.0.0.1:8545" >&2
          tail -n 200 /tmp/anvil.log || true
          exit 1

      - name: Run release orchestrator dry-run
        run: forge script script/ops/settlement/ReleaseMARK.s.sol --rpc-url $RPC_URL -vv

      - name: Run release orchestrator execute smoke (local Anvil)
        env:
          MARK_RELEASE_EXECUTE: "true"
          MARK_RELEASE_WRITE_ARTIFACT: "true"
          MARK_RELEASE_ARTIFACT_PATH: broadcast/mark-release-ci.json
          MARK_RELEASE_STRICT_VERIFY: "true"
          VERIFY_MARK_SETTLEMENT_PROOF_ENABLED: "false"
          VERIFY_MARK_SETTLEMENT_PRODUCTION_MODE: "false"
          VERIFY_MARK_SETTLEMENT_VERIFIER: "0x0000000000000000000000000000000000000000"
        run: forge script script/ops/settlement/ReleaseMARK.s.sol --rpc-url $RPC_URL --broadcast -vv

      - name: Assert release artifact schema
        run: |
          test -f broadcast/mark-release-ci.json
          jq -e '
            .chainId != null and
            .deployer != "0x0000000000000000000000000000000000000000" and
            .token != "0x0000000000000000000000000000000000000000" and
            .adapter != "0x0000000000000000000000000000000000000000" and
            .module != "0x0000000000000000000000000000000000000000" and
            .timestamp != null and
            .gitCommit != null
          ' broadcast/mark-release-ci.json

      - name: Print anvil logs on failure
        if: failure()
        run: tail -n 200 /tmp/anvil.log || true

  contracts-production-mode-smoke:
    name: Contracts Production Mode Smoke
    runs-on: ubuntu-latest
    needs: contracts-unit-invariant
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run production mode smoke target
        run: make smoke-production-mode

      - name: Print anvil logs on failure
        if: failure()
        run: tail -n 200 /tmp/mark-anvil.log || true

  contracts-integration:
    name: Contracts Integration (RPC)
    runs-on: ubuntu-latest
    needs: [contracts-unit-invariant, contracts-release-check, contracts-production-mode-smoke]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_integration == 'true' }}
    defaults:
      run:
        working-directory: contracts
    env:
      CHAIN_A_RPC_URL: http://127.0.0.1:9545
      CHAIN_B_RPC_URL: http://127.0.0.1:9546

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Setup pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.2 --activate
          pnpm --version

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Start supersim
        run: pnpm dev:supersim > /tmp/supersim.log 2>&1 &
        working-directory: .

      - name: Wait for supersim readiness
        run: pnpm wait-port http://127.0.0.1:8420/ready
        working-directory: .

      - name: Run integration suite
        run: FOUNDRY_PROFILE=integration forge test --match-path 'test/integration/**/*.t.sol' -vv

      - name: Print supersim logs on failure
        if: failure()
        run: tail -n 200 /tmp/supersim.log || true
