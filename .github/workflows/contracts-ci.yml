name: Contracts CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests against local supersim endpoints (127.0.0.1:9545/9546)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  contracts-unit-invariant:
    name: Contracts Unit + Invariant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
        continue-on-error: true
        id: checkout-attempt-1

      - name: Retry checkout on failure
        if: steps.checkout-attempt-1.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          clean: false

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0

      - name: Enforce architecture boundaries
        run: make architecture-guard

      - name: Enforce test/script layering boundaries
        run: make layering-guard

      - name: Run deterministic test suite
        run: forge test -vv

      - name: Run production lock invariants
        run: make test-production-lock

      - name: Check gas snapshot
        run: make gas-check

  contracts-release-check:
    name: Contracts Release Check (Dry-Run + Execute Smoke)
    runs-on: ubuntu-latest
    needs: contracts-unit-invariant
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    env:
      RPC_URL: http://127.0.0.1:8545
      MARK_RELEASE_EXECUTE: 'false'
      MARK_RELEASE_RUN_POSTDEPLOY: 'false'
      MARK_RELEASE_WRITE_ARTIFACT: 'false'
      MARK_GIT_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
        continue-on-error: true
        id: checkout-attempt-1

      - name: Retry checkout on failure
        if: steps.checkout-attempt-1.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          clean: false

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0

      - name: Start anvil
        run: anvil --host 127.0.0.1 --port 8545 > /tmp/anvil.log 2>&1 &

      - name: Wait for anvil readiness
        run: |
          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 8545; then
              exit 0
            fi
            sleep 1
          done
          echo "anvil did not become ready on 127.0.0.1:8545" >&2
          tail -n 200 /tmp/anvil.log || true
          exit 1

      - name: Export anvil deployer private key
        run: |
          key="$(grep -Eo '\(0\)[[:space:]]*0x[0-9a-fA-F]{64}' /tmp/anvil.log | head -n 1 | sed -E 's/^\(0\)[[:space:]]*//')"
          if [ -z "$key" ]; then
            echo "failed to extract anvil deployer key" >&2
            tail -n 120 /tmp/anvil.log || true
            exit 1
          fi
          echo "PRIVATE_KEY=$key" >> "$GITHUB_ENV"

      - name: Run release orchestrator dry-run
        run: forge script script/ops/settlement/ReleaseMARK.s.sol --rpc-url $RPC_URL -vv

      - name: Run release orchestrator execute smoke (local Anvil)
        env:
          MARK_RELEASE_EXECUTE: 'true'
          MARK_RELEASE_WRITE_ARTIFACT: 'true'
          MARK_RELEASE_ARTIFACT_PATH: broadcast/mark-release-ci.json
          MARK_RELEASE_STRICT_VERIFY: 'true'
          VERIFY_MARK_SETTLEMENT_PROOF_ENABLED: 'false'
          VERIFY_MARK_SETTLEMENT_PRODUCTION_MODE: 'false'
          VERIFY_MARK_SETTLEMENT_VERIFIER: '0x0000000000000000000000000000000000000000'
        run: forge script script/ops/settlement/ReleaseMARK.s.sol --rpc-url $RPC_URL --broadcast --non-interactive -vv

      - name: Assert release artifact schema
        run: |
          test -f broadcast/mark-release-ci.json
          jq -e '
            .chainId != null and
            .deployer != "0x0000000000000000000000000000000000000000" and
            .token != "0x0000000000000000000000000000000000000000" and
            .adapter != "0x0000000000000000000000000000000000000000" and
            .module != "0x0000000000000000000000000000000000000000" and
            .timestamp != null and
            .gitCommit != null
          ' broadcast/mark-release-ci.json

      - name: Run pool release orchestrator dry-run
        run: |
          TOKEN=$(jq -r '.token' broadcast/mark-release-ci.json)
          POOL_VERIFIER=$(forge create src/pool/verifier/MARKPoolVerifier.sol:MARKPoolVerifier \
            --rpc-url $RPC_URL \
            --private-key $PRIVATE_KEY \
            --broadcast \
            --json | jq -r '.deployedTo')
          if [ -z "$POOL_VERIFIER" ] || [ "$POOL_VERIFIER" = "null" ]; then
            echo "failed to deploy MARKPoolVerifier for pool dry-run" >&2
            exit 1
          fi
          MARK_RYLA_TOKEN="$TOKEN" \
          MARK_POOL_VERIFIER="$POOL_VERIFIER" \
          forge script script/ops/pool/ReleasePool.s.sol --rpc-url $RPC_URL -vv

      # Pool execute smoke is omitted: Foundry's contract size check rejects the
      # PoseidonT3 library artifact (55,856 bytes) during broadcast even though
      # via_ir inlines it into MARKPool at compile time (MARKPool itself is 24,298
      # bytes and deployable). The dry-run above validates the pool release script
      # logic without triggering the size check. See KI-8 in KNOWN_ISSUES.md.

      - name: Print anvil logs on failure
        if: failure()
        run: tail -n 200 /tmp/anvil.log || true

  contracts-production-mode-smoke:
    name: Contracts Production Mode Smoke
    runs-on: ubuntu-latest
    needs: contracts-unit-invariant
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
        continue-on-error: true
        id: checkout-attempt-1

      - name: Retry checkout on failure
        if: steps.checkout-attempt-1.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          clean: false

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0

      - name: Run production mode smoke target
        run: make smoke-production-mode

      - name: Print anvil logs on failure
        if: failure()
        run: tail -n 200 /tmp/mark-anvil.log || true

  contracts-integration:
    name: Contracts Integration (RPC)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [contracts-unit-invariant, contracts-release-check, contracts-production-mode-smoke]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_integration == 'true' }}
    defaults:
      run:
        working-directory: contracts
    env:
      CHAIN_A_RPC_URL: http://127.0.0.1:9545
      CHAIN_B_RPC_URL: http://127.0.0.1:9546

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Setup pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.2 --activate
          pnpm --version

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0

      - name: Start supersim
        run: pnpm dev:supersim > /tmp/supersim.log 2>&1 &
        working-directory: .

      - name: Wait for supersim readiness
        run: |
          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 9545 && nc -z 127.0.0.1 9546; then exit 0; fi
            sleep 2
          done
          echo "supersim did not become ready on ports 9545/9546" >&2
          tail -n 100 /tmp/supersim.log || true
          exit 1
        working-directory: .

      - name: Run integration suite
        run: FOUNDRY_PROFILE=integration forge test --match-path 'test/integration/**/*.t.sol' -vv

      - name: Print supersim logs on failure
        if: failure()
        run: tail -n 200 /tmp/supersim.log || true
