name: Reusable Contracts Slither

on:
  workflow_call:
    inputs:
      foundry_version:
        description: Foundry version used for Slither compile path
        required: false
        default: "1.8.0"
        type: string

jobs:
  slither-core:
    name: Slither Core Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Slither
        run: pip install slither-analyzer==0.11.5

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d
        with:
          version: v${{ inputs.foundry_version }}

      - name: Run Slither on MARK core contracts
        working-directory: contracts
        run: make slither-core
