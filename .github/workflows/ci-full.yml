name: CI Full
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *' # Daily at 2:30am UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Fast checks (reusable - same as ci-fast.yml)
  secrets:
    name: Secret Scan (trufflehog)
    uses: ./.github/workflows/_reusable-secrets.yml

  typecheck-lint:
    name: Typecheck + Lint
    uses: ./.github/workflows/_reusable-typecheck-lint.yml

  contracts-core:
    name: Contracts Core (Unit + Invariant)
    uses: ./.github/workflows/_reusable-contracts-core.yml
    with:
      run_invariant: 'false'

  contracts-security:
    name: Contracts Security (Semgrep)
    uses: ./.github/workflows/_reusable-contracts-security.yml
    with:
      run_semgrep: 'true'

  contracts-fuzz:
    name: Contracts Fuzz
    uses: ./.github/workflows/_reusable-contracts-fuzz.yml
    with:
      run_fuzz: 'true'
      fuzz_runs: '256'

  circuits-core:
    name: Circuits Core (Build + Tests + Circomspect)
    uses: ./.github/workflows/_reusable-circuits-core.yml
    with:
      run_tests: 'true'
      run_circomspect: 'true'

  frontend-checks:
    name: Frontend Checks (Node 24)
    uses: ./.github/workflows/_reusable-frontend-checks.yml
    with:
      node_versions: '[ "24.3.0" ]'
      pnpm_version: '9.0.2'

  # Full checks (ci-full specific)
  contracts-core-full:
    name: Contracts Core (With Invariants)
    needs: [contracts-core]
    uses: ./.github/workflows/_reusable-contracts-core.yml
    with:
      run_invariant: 'true'

  sbom:
    name: Generate SBOM
    needs:
      - secrets
      - typecheck-lint
      - contracts-core
      - contracts-security
      - contracts-fuzz
      - circuits-core
      - frontend-checks
    uses: ./.github/workflows/_reusable-sbom.yml

  release-gate:
    name: Release Gate Container
    needs:
      - secrets
      - typecheck-lint
      - contracts-core
      - contracts-security
      - contracts-fuzz
      - circuits-core
      - frontend-checks
    uses: ./.github/workflows/contracts-release-gate.yml
    secrets:
      DOCKER_REGISTRY_TOKEN: ${{ secrets.GHCR_PAT }}