name: CodeQL

# CodeQL requires GitHub Advanced Security (org-level feature).
# This workflow is disabled until the repo is transferred to an org with GHAS enabled.
# Re-enable by restoring the `on:` triggers below.
on:
  workflow_dispatch: # manual trigger only until GHAS is available

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
