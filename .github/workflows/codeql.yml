name: CodeQL

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'contracts/src/**'
      - 'contracts/script/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze-js:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.3.0'
          pnpm-version: '9.0.2'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4

  analyze-solidity:
    name: Analyze (solidity)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0
        with:
          cache: true
          cache-key: foundry-${{ runner.os }}
          version: '1.7.1'

      - name: Install dependencies
        run: |
          cd contracts && forge install --no-commit || echo "forge install failed (may use pinned deps), continuing..."

      # KNOWN TOOLING GAP: Default CodeQL bundle lacks Solidity extractor
      # This step fails with "Did not recognize the following languages: solidity"
      # Options to fix: (1) Custom CodeQL bundle with Solidity extractor, (2) Use Slither (crashes on MARK), (3) Accept gap
      # Primary Solidity security coverage: Fuzzing (256 runs) + Invariant tests + Semgrep
      - name: Initialize CodeQL (Solidity - EXPECTED TO FAIL)
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: solidity
          queries: security-extended
          build-mode: manual
        continue-on-error: true

      - name: Build contracts
        run: cd contracts && forge build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          database-directory: ${{ github.workspace }}/contracts/codeql-db
        continue-on-error: true