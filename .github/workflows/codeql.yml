name: CodeQL (DEPRECATED)

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'contracts/src/**'
      - 'contracts/script/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  deprecated-notice:
    name: Deprecated Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Deprecation Notice
        run: |
          echo "::warning::This workflow is deprecated. CodeQL analysis is now part of the unified security.yml workflow."
          echo "::warning::Please update your branch protection rules and references to use security.yml instead."
