name: Governance Policy Guard

on:
  pull_request:
    paths:
      - 'scripts/github/apply-governance.sh'
      - 'docs/BRANCHING.md'
      - '.github/PRODUCTION_GOVERNANCE_CHECKLIST.md'
      - '.github/workflows/governance-policy-guard.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'scripts/github/apply-governance.sh'
      - 'docs/BRANCHING.md'
      - '.github/PRODUCTION_GOVERNANCE_CHECKLIST.md'
      - '.github/workflows/governance-policy-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-governance-policy:
    name: Validate Governance Policy Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run governance policy validator
        run: bash scripts/ci/validate-governance-policy.sh
