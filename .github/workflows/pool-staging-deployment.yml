name: Pool Staging Deployment

on:
  workflow_dispatch:
    inputs:
      rpc_url:
        description: 'Target RPC URL (leave blank to use MARK_STAGING_RPC_URL repository variable)'
        required: false
        default: ''
        type: string
      ryla_token:
        description: 'Deployed RYLA token address'
        required: false
        default: '0xa27360e124B94449249D1E919d3363BfF1c10c02'
        type: string
      pool_poseidon:
        description: 'PoseidonT3 contract address (default: Semaphore)'
        required: false
        default: '0xB43122Ecb241DD50062641f089876679fd06599a'
        type: string
      pool_intent_signer:
        description: 'Intent signer address (0x0 to skip)'
        required: false
        default: '0x0000000000000000000000000000000000000000'
        type: string
      artifact_path:
        description: 'Artifact output path under contracts/'
        required: false
        default: 'broadcast/mark-pool-staging.json'
        type: string

permissions:
  contents: read

jobs:
  pool-staging-deploy:
    name: Pool Staging Deployment
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: staging
    defaults:
      run:
        working-directory: contracts
    env:
      RPC_URL: ${{ inputs.rpc_url != '' && inputs.rpc_url || vars.MARK_STAGING_RPC_URL }}
      MARK_RYLA_TOKEN: ${{ inputs.ryla_token }}
      MARK_POOL_POSEIDON: ${{ inputs.pool_poseidon }}
      MARK_POOL_INTENT_SIGNER: ${{ inputs.pool_intent_signer }}
      MARK_POOL_RELEASE_EXECUTE: 'true'
      MARK_POOL_RELEASE_WRITE_ARTIFACT: 'true'
      MARK_POOL_RELEASE_ARTIFACT_PATH: ${{ inputs.artifact_path }}
      MARK_GIT_COMMIT: ${{ github.sha }}

    steps:
      - name: Enforce dev or main branch
        working-directory: .
        run: |
          if [ "${GITHUB_REF_NAME}" != "dev" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Pool deployment must run from dev or main branch. Current: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Validate inputs
        working-directory: .
        run: |
          set -euo pipefail
          validate_address() {
            local val="$1" label="$2"
            # Allow 0x0 as sentinel for optional addresses (e.g. pool_intent_signer)
            [ "$val" = "0x0" ] && return 0
            if ! echo "$val" | grep -qE '^0x[0-9a-fA-F]{40}$'; then
              echo "Invalid address for $label: $val" >&2; exit 1
            fi
          }
          validate_address "$MARK_RYLA_TOKEN" "ryla_token"
          validate_address "$MARK_POOL_POSEIDON" "pool_poseidon"
          validate_address "$MARK_POOL_INTENT_SIGNER" "pool_intent_signer"
          if [ -z "$RPC_URL" ]; then echo "RPC_URL is required (use rpc_url input or set MARK_STAGING_RPC_URL repository variable)" >&2; exit 1; fi
          if [ -z "$MARK_POOL_RELEASE_ARTIFACT_PATH" ] || [ "$MARK_POOL_RELEASE_ARTIFACT_PATH" = "." ] || [ "$MARK_POOL_RELEASE_ARTIFACT_PATH" = ".." ]; then
            echo "artifact_path must be a safe relative path" >&2; exit 1
          fi
          case "$MARK_POOL_RELEASE_ARTIFACT_PATH" in
            *../*|*/..|./*|/*|*/./*|*/../*) echo "artifact_path must be a safe relative path" >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Ensure required secret is present
        working-directory: .
        env:
          PRIVATE_KEY: ${{ secrets.MARK_STAGING_DEPLOYER_PRIVATE_KEY }}
        run: |
          test -n "${PRIVATE_KEY}" || {
            echo "MARK_STAGING_DEPLOYER_PRIVATE_KEY secret is required";
            exit 1;
          }

      - name: Setup Foundry
        uses: ./.github/actions/setup-foundry
        with:
          version: '1.7.1'

      - name: Deploy Groth16Verifier
        env:
          PRIVATE_KEY: ${{ secrets.MARK_STAGING_DEPLOYER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERIFIER=$(forge create src/pool/verifier/MARKPoolVerifier.sol:Groth16Verifier \
            --rpc-url "$RPC_URL" \
            --private-key "$PRIVATE_KEY" \
            --broadcast \
            --json | jq -r '.deployedTo')
          if [ -z "$VERIFIER" ] || [ "$VERIFIER" = "null" ]; then
            echo "Failed to deploy Groth16Verifier" >&2
            exit 1
          fi
          echo "Groth16Verifier: $VERIFIER"
          echo "MARK_POOL_VERIFIER=$VERIFIER" >> "$GITHUB_ENV"

      - name: Run pool release script
        env:
          PRIVATE_KEY: ${{ secrets.MARK_STAGING_DEPLOYER_PRIVATE_KEY }}
        run: forge script script/ops/pool/ReleasePool.s.sol --rpc-url "$RPC_URL" --broadcast --slow --non-interactive -vv

      - name: Upload pool artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mark-pool-staging
          path: contracts/${{ inputs.artifact_path }}
          if-no-files-found: ignore
