name: reorg-sim
on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    - cron: '0 4 * * *' # Nightly at 4am UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  reorg-test:
    name: 1-Block Reorg Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip on forks without secrets access
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check for pool/reorg changes
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "schedule" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          BASE="origin/$BASE_REF"
          CHANGED=$(git diff --name-only "$BASE"...HEAD | grep -cE '(contracts/src/pool/|contracts/test/.*[Rr]eorg)' || true)
          if [ "$CHANGED" -gt 0 ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "No pool/reorg files changed, skipping reorg simulation"
          fi

      - name: Install mise
        if: steps.check.outputs.run == 'true'
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true

      - name: Setup
        if: steps.check.outputs.run == 'true'
        run: mise install

      - name: Check for RPC secret
        if: steps.check.outputs.run == 'true'
        id: check-rpc
        run: |
          if [ -z "${{ secrets.OP_SEPOLIA_RPC }}" ]; then
            echo "::warning::OP_SEPOLIA_RPC secret not available"
            echo "has_secret=false" >> $GITHUB_OUTPUT
          else
            echo "has_secret=true" >> $GITHUB_OUTPUT
          fi

      - name: Run reorg double-spend test
        if: steps.check.outputs.run == 'true' && steps.check-rpc.outputs.has_secret == 'true'
        run: |
          set -euo pipefail
          cd contracts

          echo "Running reorg simulation against OP Sepolia fork..."

          # Run reorg tests once. Capture output and exit code separately.
          # --match-test filters test function names (case-insensitive substring match).
          OUTPUT=$(forge test --match-test 'testReorg.*' --fork-url "${{ secrets.OP_SEPOLIA_RPC }}" --fork-block-number 18000000 -vvv 2>&1) && STATUS=0 || STATUS=$?

          echo "$OUTPUT"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Reorg test failed with exit code $STATUS. NULLIFIER REPLAY DETECTED."
            echo "This indicates a critical vulnerability: 1-block L2 reorg can cause double-spend."
            exit 1
          fi

          # Additional check: ensure no FAILURES string appeared in output
          if echo "$OUTPUT" | grep -q "FAILURES"; then
            echo "::error::Reorg test output contains FAILURES. NULLIFIER REPLAY DETECTED."
            exit 1
          fi

          echo "Reorg tests passed."
        env:
          OP_SEPOLIA_RPC: ${{ secrets.OP_SEPOLIA_RPC }}

      - name: Skip reorg test (no secret)
        if: steps.check.outputs.run == 'true' && steps.check-rpc.outputs.has_secret != 'true'
        run: |
          echo "::warning::Skipping reorg test, OP_SEPOLIA_RPC secret not available"
          echo "This is expected for PRs from forks. Nightly scheduled runs will execute this test."