name: reorg-sim
on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    - cron: '0 4 * * *' # Nightly at 4am UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  reorg-test:
    name: 1-Block Reorg Simulation
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    # Skip on forks without secrets access
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check for pool/reorg changes
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "schedule" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          BASE="origin/$BASE_REF"
          CHANGED=$(git diff --name-only "$BASE"...HEAD | grep -cE '(contracts/src/pool/|contracts/test/.*[Rr]eorg)' || true)
          if [ "$CHANGED" -gt 0 ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "No pool/reorg files changed, skipping reorg simulation"
          fi

      - name: Install mise
        if: steps.check.outputs.run == 'true'
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true

      - name: Setup
        if: steps.check.outputs.run == 'true'
        run: mise install

      - name: Check for RPC secret
        if: steps.check.outputs.run == 'true'
        id: check-rpc
        run: |
          if [ -z "${{ secrets.OP_SEPOLIA_RPC }}" ]; then
            echo "::warning::OP_SEPOLIA_RPC secret not available"
            echo "has_secret=false" >> $GITHUB_OUTPUT
          else
            echo "has_secret=true" >> $GITHUB_OUTPUT
          fi

      - name: Run reorg double-spend test
        if: steps.check.outputs.run == 'true' && steps.check-rpc.outputs.has_secret == 'true'
        env:
          OP_SEPOLIA_RPC: ${{ secrets.OP_SEPOLIA_RPC }}
          # The reorg tests live under test/integration/**, which the default
          # foundry profile excludes via no_match_path. The integration profile
          # includes them so this security test actually executes.
          FOUNDRY_PROFILE: integration
        run: |
          set -euo pipefail
          cd contracts

          # Normalize the RPC endpoint. forge's vm.createFork rejects scheme-less
          # URLs ("invalid rpc url"), so default to https:// when no scheme is set.
          case "$OP_SEPOLIA_RPC" in
            http://* | https://* | ws://* | wss://*) ;;
            *) OP_SEPOLIA_RPC="https://${OP_SEPOLIA_RPC}" ;;
          esac
          export OP_SEPOLIA_RPC

          echo "Running reorg simulation against OP Sepolia fork..."

          # ReorgSimulationTest creates its own fork from $OP_SEPOLIA_RPC via
          # vm.createFork, so we must NOT pass --fork-url: doing so makes forge
          # eagerly instantiate a global fork and fail before any test runs.
          OUTPUT=$(forge test --match-contract 'ReorgSimulationTest' -vvv 2>&1) && STATUS=0 || STATUS=$?

          echo "$OUTPUT"

          # A fork that cannot be instantiated is an infrastructure problem.
          if echo "$OUTPUT" | grep -qiE "could not instantiate forked environment|invalid rpc url"; then
            # For pull_request events, warn and skip (forks may not have secrets).
            # For push and scheduled runs, treat as hard failure (the nightly gate must work).
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::Reorg simulation skipped: could not instantiate the OP Sepolia fork. Check the OP_SEPOLIA_RPC secret (must be a full RPC URL) and RPC availability."
              exit 0
            else
              echo "::error::Reorg simulation failed: could not instantiate the OP Sepolia fork. Check the OP_SEPOLIA_RPC secret (must be a full RPC URL) and RPC availability."
              exit 1
            fi
          fi

          # Guard against a silent no-op: if the profile/filter matches nothing,
          # the security test never ran and must not be reported as a pass.
          if echo "$OUTPUT" | grep -q "No tests found"; then
            echo "::error::No reorg tests were executed (check FOUNDRY_PROFILE / --match-contract)."
            exit 1
          fi

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Reorg double-spend test failed (exit $STATUS). Possible nullifier replay enabling double-spend on a 1-block L2 reorg."
            exit 1
          fi

          echo "Reorg tests passed."

      - name: Skip reorg test (no secret)
        if: steps.check.outputs.run == 'true' && steps.check-rpc.outputs.has_secret != 'true'
        run: |
          echo "::warning::Skipping reorg test, OP_SEPOLIA_RPC secret not available"
          echo "This is expected for PRs from forks. Nightly scheduled runs will execute this test."