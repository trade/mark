name: Format Check

on:
  pull_request:
    paths:
      - 'contracts/src/**'
      - 'contracts/test/**'
      - 'contracts/script/**'
      - 'src/**'
      - '.github/workflows/fmt.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  forge-fmt:
    name: Solidity Format (forge fmt)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Setup persistent cache (Blacksmith)
        uses: useblacksmith/stickydisk@4c034ba57b706cf0e3b4b0ce098c2a3b1071580c # v1
        with:
          path: |
            ~/.cache
            ~/.cargo
            ~/.foundry
            node_modules
            circuits/node_modules
            contracts/lib

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-key-suffix: fmt-contracts

      - name: Check Solidity formatting
        run: forge fmt --check

  ts-fmt:
    name: TypeScript Format (prettier)
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-key-suffix: fmt-typescript

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript formatting
        run: pnpm format:check