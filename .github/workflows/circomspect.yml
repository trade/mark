name: circomspect

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write  # Required for SARIF upload to GitHub Security tab
  actions: read

jobs:
  circomspect:
    name: Circom Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.7
        with:
          fetch-depth: 0

      - name: Check for circuit changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD | grep -cE '\.(circom|js)$' || true)
          if [ "$CHANGED" -gt 0 ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "No circuit files changed, skipping circomspect"
          fi

      - name: Install mise
        if: steps.check.outputs.run == 'true'
        uses: jdx/mise-action@63a424527440f26bb8463e396d1e4e5e9f57a3a2 # v2.0.0
        with:
          install: true
          cache: true

      - name: Setup toolchain
        if: steps.check.outputs.run == 'true'
        run: mise install

      - name: Run circomspect
        if: steps.check.outputs.run == 'true'
        run: |
          set -euo pipefail
          echo "Running circomspect static analysis..."
          circomspect circuits/ \
            --error unused_signals \
            --error unconstrained_signals \
            --error non_deterministic_circuits \
            --sarif circomspect.sarif \
            2>&1 | tee circomspect-output.log
          echo "Circomspect passed, no circuit vulnerabilities found"

      - name: Upload SARIF to GitHub Security
        if: always() && steps.check.outputs.run == 'true'
        uses: github/codeql-action/upload-sarif@51313611dfbc5bd21517390ab8e8517fd8363fb1 # v3.25.15
        with:
          sarif_file: circomspect.sarif
          category: circomspect
