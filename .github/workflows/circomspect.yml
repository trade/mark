name: circomspect

on:
  pull_request:
    paths:
      - 'circuits/**/*.circom'
      - 'circuits/**/*.js'
      - '.github/workflows/circomspect.yml'
  push:
    branches: [dev, main]
    paths: ['circuits/**/*.circom']

permissions:
  contents: read
  security-events: write  # Required for SARIF upload to GitHub Security tab
  actions: read

jobs:
  circomspect:
    name: Circom Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.7

      - name: Install mise
        uses: jdx/mise-action@63a424527440f26bb8463e396d1e4e5e9f57a3a2 # v2.0.0
        with:
          install: true
          cache: true

      - name: Setup toolchain
        run: mise install

      - name: Run circomspect
        run: |
          set -euo pipefail
          
          # Fails on unconstrained signals, unused signals, non-deterministic circuits
          # These are silent exploits in ZK — must be treated as errors
          echo "Running circomspect static analysis..."
          
          # Use --error to fail on issues, not just --warn
          circomspect circuits/ \
            --error unused_signals \
            --error unconstrained_signals \
            --error non_deterministic_circuits \
            --sarif circomspect.sarif \
            2>&1 | tee circomspect-output.log
          
          echo "Circomspect passed — no circuit vulnerabilities found"

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@51313611dfbc5bd21517390ab8e8517fd8363fb1 # v3.25.15
        with:
          sarif_file: circomspect.sarif
          category: circomspect

      - name: Fail on circomspect findings
        if: failure()
        run: |
          echo "::error::Circomspect found circuit vulnerabilities. See SARIF upload and logs."
          exit 1
