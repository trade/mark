name: circomspect
on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

jobs:
  circomspect:
    name: Circom Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check for circuit changes
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          BASE="origin/$BASE_REF"
          CHANGED=$(git diff --name-only "$BASE"...HEAD | grep -cE '\.(circom|js)$' || true)
          if [ "$CHANGED" -gt 0 ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "No circuit files changed, skipping circomspect"
          fi

      - name: Install mise
        if: steps.check.outputs.run == 'true'
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true

      - name: Cache cargo
        if: steps.check.outputs.run == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Setup toolchain
        if: steps.check.outputs.run == 'true'
        run: mise install

      - name: Install circomspect
        if: steps.check.outputs.run == 'true'
        run: cargo install circomspect --version 0.9.0 --locked
        env:
          CARGO_NET_RETRY: 2
          CARGO_HTTP_TIMEOUT: 30

      - name: Install circuits dependencies
        if: steps.check.outputs.run == 'true'
        working-directory: circuits
        run: pnpm install --frozen-lockfile

      - name: Run circomspect
        if: steps.check.outputs.run == 'true'
        working-directory: circuits
        run: |
          set -euo pipefail
          echo "Running circomspect static analysis..."
          circomspect . \
            -l ERROR \
            -L node_modules \
            --sarif-file ../circomspect.sarif \
            2>&1 | tee ../circomspect-output.log
          echo "Circomspect passed, no circuit vulnerabilities found"

      - name: Upload SARIF to GitHub Security
        if: steps.check.outputs.run == 'true'
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: circomspect.sarif
          category: circomspect