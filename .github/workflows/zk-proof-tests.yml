name: zk-proof-tests

on:
  pull_request:
    paths:
      - 'circuits/**'
      - 'contracts/src/pool/verifier/**'
      - '.github/workflows/zk-proof-tests.yml'
  push:
    branches: [dev, main]
    paths: ['circuits/**']

permissions:
  contents: read

jobs:
  zk-tests:
    name: ZK Circuit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.7
        with:
          submodules: recursive

      - name: Install mise
        uses: jdx/mise-action@63a424527440f26bb8463e396d1e4e5e9f57a3a2 # v2.0.0
        with:
          install: true
          cache: true

      - name: Setup project
        run: mise run setup

      - name: Download Powers of Tau
        run: |
          set -euo pipefail
          cd circuits
          
          # Powers of Tau file from Hermez (trusted setup ceremony)
          # SHA256 pinned for integrity verification
          PTAU_FILE="pot12_final.ptau"
          PTAU_URL="https://hermez.s3-eu-west-1.amazonaws.com/powersOfTau28_hez_final_12.ptau"
          # Known SHA256 of powersOfTau28_hez_final_12.ptau (Hermez ceremony)
          # This is a 2^12 (4096) constraint ceremony file
          EXPECTED_SHA256="19464c3b80c0a92e0a766322e0baa63d36872f97c80eecd45c1e9796e2a8d45"
          
          if [ ! -f "$PTAU_FILE" ]; then
            echo "Downloading Powers of Tau (2^12 constraints)..."
            wget -q --show-progress "$PTAU_URL" -O "$PTAU_FILE"
            
            echo "Verifying SHA256 checksum..."
            ACTUAL_SHA256=$(sha256sum "$PTAU_FILE" | cut -d' ' -f1)
            
            if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "::error::Powers of Tau checksum mismatch!"
              echo "Expected: $EXPECTED_SHA256"
              echo "Actual:   $ACTUAL_SHA256"
              echo "Possible corruption or tampering detected. Removing file."
              rm -f "$PTAU_FILE"
              exit 1
            fi
            
            echo "✓ Powers of Tau verified (SHA256: $EXPECTED_SHA256)"
          else
            echo "Powers of Tau already exists, skipping download"
          fi

      - name: Compile circuits + export verifiers
        run: mise run circuit

      - name: Test completeness
        run: |
          cd circuits
          # Checks: valid witness -> valid proof -> verifier returns true
          # This ensures honest users can always generate valid proofs
          pnpm run test:completeness

      - name: Test soundness  
        run: |
          cd circuits
          # Checks: invalid witness -> proof generation fails OR verifier returns false
          # This is CRITICAL. Must fail if you remove a constraint.
          # Tests various invalid inputs: wrong amounts, bad merkle roots, etc.
          pnpm run test:soundness

      - name: Forge test Solidity verifier
        run: |
          cd contracts
          # Test the exported Solidity verifier contract integrates correctly
          forge test --match-path "test/**/Verifier*.t.sol" -vvv || \
            forge test --match-contract "*Verifier*" -vvv || {
              echo "::warning::No Verifier-specific tests found, running pool tests with verifier"
              forge test --match-path "test/unit/pool/*Pool*.t.sol" -vvv
            }
