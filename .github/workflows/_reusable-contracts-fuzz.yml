name: Reusable Contracts Fuzz

on:
  workflow_call:
    inputs:
      run_fuzz:
        description: 'Run fuzz tests'
        required: false
        default: 'true'
        type: string
      fuzz_runs:
        description: 'Number of fuzz runs per test'
        required: false
        default: '256'
        type: string

permissions:
  contents: read

jobs:
  fuzz:
    name: Contracts Fuzz
    if: ${{ inputs.run_fuzz == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Setup persistent cache (Blacksmith)
        uses: useblacksmith/stickydisk@4c034ba57b706cf0e3b4b0ce098c2a3b1071580c # v1
        with:
          path: |
            ~/.cache
            ~/.cargo
            ~/.foundry
            node_modules
            circuits/node_modules
            contracts/lib

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-key-suffix: contracts-fuzz

      - name: Install dependencies
        run: |
          forge install --no-commit || echo "forge install failed (may use pinned deps), continuing..."

      - name: Run fuzz tests (core math + bridge limits)
        run: |
          forge test --match-test testFuzz --fuzz-runs ${{ inputs.fuzz_runs }} -vv