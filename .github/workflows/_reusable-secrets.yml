name: Reusable Secrets Scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret Scan (trufflehog)
    permissions:
      contents: read
    # Run on: schedule, workflow_dispatch, or PRs targeting main/dev
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'dev'))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Run trufflehog
        # Secret scanning is the CI gate for leaked credentials (CodeQL's
        # hard-coded-credential queries are intentionally excluded in
        # .github/codeql/codeql-config.yml), so fail the job and block the merge
        # when TruffleHog reports a finding on a pull request. Scheduled and
        # manual full-history scans stay non-blocking: their findings surface as
        # annotations only (blocking them would flag pre-existing history on
        # every run and break dependent jobs in ci-full). The action always
        # passes --fail, so a finding exits non-zero (code 183).
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70 # v3.95.6
        with:
          path: ./
          # base/head are omitted so the action derives them from the event:
          # pull_request diffs the PR base SHA against the PR head SHA (both
          # reliably present with fetch-depth: 0); schedule and workflow_dispatch
          # scan the full branch history. The action already adds --github-actions
          # and --fail, so only result filtering is set here. verified,unknown
          # follows TruffleHog's CI guidance: block on confirmed and
          # unverifiable secrets while ignoring low-confidence unverified hits.
          extra_args: --results=verified,unknown

      # Note: trufflehog --github-actions emits findings as GitHub Actions workflow
      # annotations; it does not upload SARIF to the code-scanning API, so this job
      # needs only contents: read (no security-events).
