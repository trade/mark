name: Reusable Secrets Scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret Scan (trufflehog)
    permissions:
      contents: read
      security-events: write
    # Only run on schedule or workflow_dispatch (manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup persistent cache (Blacksmith)
        uses: useblacksmith/stickydisk@v1
        with:
          path: |
            ~/.cache
            ~/.cargo
            ~/.foundry
            node_modules
            circuits/node_modules
            contracts/lib

      - name: Run trufflehog
        continue-on-error: true
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        with:
          path: ./
          base: ${{ env.BASE_REF }}
          head: ${{ github.sha }}
          extra_args: --github-actions

      # Note: trufflehog --github-actions outputs directly to GitHub Security tab
      # No SARIF upload step needed when using --github-actions flag