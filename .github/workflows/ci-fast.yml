name: CI Fast
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_call:
  schedule:
    - cron: '30 2 * * *'  # Daily at 2:30am UTC (same as ci-full)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret Scan (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Run trufflehog
        continue-on-error: true
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        with:
          path: ./
          base: ${{ env.BASE_REF }}
          head: ${{ github.sha }}
          extra_args: --github-actions

      # Note: trufflehog --github-actions outputs directly to GitHub Security tab
      # No SARIF upload step needed when using --github-actions flag

  typecheck-lint:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.3.0'
          pnpm-version: '9.0.2'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -s typecheck
      - name: Lint
        run: pnpm -s lint

  contracts-core:
    name: Contracts Core (Unit + Invariant)
    uses: ./.github/workflows/_reusable-contracts-core.yml
    with:
      run_invariant: 'false'

  contracts-security:
    name: Contracts Security (Semgrep)
    uses: ./.github/workflows/_reusable-contracts-security.yml
    with:
      run_semgrep: 'true'

  contracts-fuzz:
    name: Contracts Fuzz
    uses: ./.github/workflows/_reusable-contracts-fuzz.yml
    with:
      run_fuzz: 'true'
      fuzz_runs: '256'

  circuits-core:
    name: Circuits Core (Build + Tests + Circomspect)
    uses: ./.github/workflows/_reusable-circuits-core.yml
    with:
      run_tests: 'true'
      run_circomspect: 'true'

  frontend-checks:
    name: Frontend Checks (Node 24)
    uses: ./.github/workflows/_reusable-frontend-checks.yml
    with:
      node_versions: '[ "24.3.0" ]'
      pnpm_version: '9.0.2'