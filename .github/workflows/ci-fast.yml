name: CI Fast
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret Scan (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          path: ./
          base: ${{ github.base_ref }}
          head: ${{ github.sha }}
          extra_args: --json

  typecheck-lint:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.3.0'
          pnpm-version: '9.0.2'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -s typecheck
      - name: Lint
        run: pnpm -s lint

  contracts-core:
    name: Contracts Core (Unit + Invariant)
    uses: ./.github/workflows/_reusable-contracts-core.yml
    with:
      run_invariant: 'false'

  contracts-security:
    name: Contracts Security (Semgrep)
    uses: ./.github/workflows/_reusable-contracts-security.yml
    with:
      run_semgrep: 'true'

  circuits-core:
    name: Circuits Core (Build + Tests + Circomspect)
    uses: ./.github/workflows/_reusable-circuits-core.yml
    with:
      run_tests: 'true'
      run_circomspect: 'true'

  frontend-checks:
    name: Frontend Checks (Node 24)
    uses: ./.github/workflows/_reusable-frontend-checks.yml
    with:
      node_versions: '[ "24.3.0" ]'
      pnpm_version: '9.0.2'
