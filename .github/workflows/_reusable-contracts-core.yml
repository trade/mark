name: Reusable Contracts Core

on:
  workflow_call:
    inputs:
      run_invariant:
        description: 'Run invariant tests'
        required: false
        default: 'false'
        type: string

permissions:
  contents: read

jobs:
  contracts-core:
    name: Contracts Core
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-key-suffix: contracts

      - name: Enforce architecture boundaries
        run: make architecture-guard

      - name: Enforce test/script layering boundaries
        run: make layering-guard

      - name: Enforce MARKPool bytecode size budget
        run: make size-guard

      - name: Run deterministic test suite
        run: forge test -vv

      - name: Run production lock invariants
        run: make test-production-lock

      - name: Check gas snapshot
        run: FOUNDRY_PROFILE=default make gas-check

      - name: Run invariant tests
        if: ${{ inputs.run_invariant == 'true' }}
        run: |
          forge test --match-contract MARKPoolInvariants -vv
          forge test --match-contract MARKSettlementInvariants -vv
          forge test --match-contract MARKBridgeInvariants -vv