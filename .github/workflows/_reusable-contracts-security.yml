name: Reusable Contracts Security

on:
  workflow_call:
    inputs:
      run_semgrep:
        description: 'Run Semgrep scan'
        required: false
        default: 'true'
        type: string

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep Scan
    if: ${{ inputs.run_semgrep == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-key-suffix: security

      - name: Setup mise (for uv/semgrep)
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true

      - name: Run Semgrep
        run: uvx semgrep@1.163.0 scan --config .semgrep.yml --severity ERROR --error contracts/ circuits/