name: Reusable Contracts Security

on:
  workflow_call:
    inputs:
      run_semgrep:
        description: 'Run Semgrep scan'
        required: false
        default: 'true'
        type: string
      run_slither:
        description: 'Run Slither static analysis'
        required: false
        default: 'true'
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep Scan
    if: ${{ inputs.run_semgrep == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true

      - name: Run Semgrep
        run: uvx semgrep scan --config .semgrep.yml --error contracts/ circuits/

  slither:
    name: Slither Core Contracts
    if: ${{ inputs.run_slither == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0
        with:
          cache: true
          cache-key: foundry-${{ runner.os }}
          version: '1.7.1'

      - name: Install dependencies
        run: |
          forge install --no-commit || echo "forge install failed (may use pinned deps), continuing..."

      - name: Build contracts (required for Slither)
        run: forge build

      - name: Run Slither
        id: slither
        continue-on-error: true
        run: |
          # Require compilation artifacts; Slither needs build artifacts to analyze
          # Exit non-zero on failure so job fails, but capture SARIF if generated
          slither . --config-file ../.slither.config.json --fail-on high --sarif slither.sarif 2>&1 | tee slither.log
          echo "SLITHER_EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Find and upload Slither SARIF
        if: always()
        run: |
          SARIF_FILE=""
          if [ -f slither.sarif ] && [ -s slither.sarif ]; then
            echo "Found SARIF: slither.sarif"
            SARIF_FILE="slither.sarif"
          else
            echo "No valid SARIF file found - Slither failed to produce output"
            # Don't create empty SARIF - let the job fail if Slither crashed
            echo "SARIF_FILE=" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "SARIF_FILE=$SARIF_FILE" >> $GITHUB_OUTPUT
        id: sarif

      - name: Upload Slither SARIF
        if: always() && steps.sarif.outputs.SARIF_FILE != ''
        uses: github/codeql-action/upload-sarif@51313611dfbc5bd21517390ab8e8517fd8363fb1 # v3.25.15
        with:
          sarif_file: ${{ steps.sarif.outputs.SARIF_FILE }}
          category: slither