name: Reusable Contracts Security

on:
  workflow_call:
    inputs:
      run_semgrep:
        description: 'Run Semgrep scan'
        required: false
        default: 'true'
        type: string

jobs:
  semgrep:
    name: Semgrep Scan
    if: ${{ inputs.run_semgrep == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true

      - name: Run Semgrep
        run: uvx semgrep scan --config .semgrep.yml --error contracts/ circuits/
