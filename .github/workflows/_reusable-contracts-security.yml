name: Reusable Contracts Security

on:
  workflow_call:
    inputs:
      run_semgrep:
        description: 'Run Semgrep scan'
        required: false
        default: 'true'
        type: string
      run_slither:
        description: 'Run Slither static analysis'
        required: false
        default: 'true'
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep Scan
    if: ${{ inputs.run_semgrep == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true

      - name: Run Semgrep
        run: uvx semgrep scan --config .semgrep.yml --error contracts/ circuits/

  slither:
    name: Slither Core Contracts
    if: ${{ inputs.run_slither == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true

      - name: Run Slither
        id: slither
        run: |
          slither . --config-file ../.slither.config.json --sarif slither.sarif 2>&1 | tee slither.log
          ls -la slither.sarif || echo "SARIF file not found"

      - name: Upload Slither SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@51313611dfbc5bd21517390ab8e8517fd8363fb1 # v3.25.15
        with:
          sarif_file: slither.sarif
          category: slither
