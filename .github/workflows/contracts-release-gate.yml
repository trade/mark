name: Contracts Release Gate (Containerized)

on:
  pull_request:
  workflow_call:
    secrets:
      DOCKER_REGISTRY_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      gate_mode:
        description: 'MARK_RELEASE_GATE_MODE: local or remote'
        required: false
        default: 'local'
        type: choice
        options:
          - local
          - remote
  push:
    branches:
      - main
      - dev
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-release-gate.yml'

permissions:
  contents: read

jobs:
  release-gate-container:
    name: Release Gate Container
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: contracts
    env:
      MARK_RELEASE_GATE_MODE: ${{ inputs.gate_mode || 'local' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Run release gate in container
        run: make release-gate-container
