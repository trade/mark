name: Contracts Release Gate (Containerized)

on:
  pull_request:
  workflow_call:
    secrets:
      DOCKER_REGISTRY_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      gate_mode:
        description: 'MARK_RELEASE_GATE_MODE: local or remote'
        required: false
        default: 'local'
        type: choice
        options:
          - local
          - remote
  push:
    branches:
      - main
      - dev
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-release-gate.yml'

permissions:
  contents: read

jobs:
  release-gate-container:
    name: Release Gate Container
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: contracts
    env:
      MARK_RELEASE_GATE_MODE: ${{ inputs.gate_mode || 'local' }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Run release gate in container
        run: make release-gate-container
