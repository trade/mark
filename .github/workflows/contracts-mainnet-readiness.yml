name: Contracts Mainnet Readiness

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Gate mode: predeploy | postdeploy | full'
        required: false
        default: 'predeploy'
        type: choice
        options:
          - predeploy
          - postdeploy
          - full
      rpc_url:
        description: 'Target RPC URL for readiness checks'
        required: true
        type: string
      artifact_path:
        description: 'Artifact output path (relative to contracts/)'
        required: false
        default: 'broadcast/mark-mainnet-gate-ci.json'
        type: string

permissions:
  contents: read

jobs:
  mainnet-readiness:
    name: Mainnet Readiness Gate
    runs-on: ubuntu-latest
    environment: production
    env:
      MARK_MAINNET_GATE_MODE: ${{ inputs.mode }}
      RPC_URL: ${{ inputs.rpc_url }}
      PRIVATE_KEY: ${{ secrets.MARK_DEPLOYER_PRIVATE_KEY }}
      MARK_MAINNET_GATE_ARTIFACT_PATH: ${{ inputs.artifact_path }}
      MARK_GIT_COMMIT: ${{ github.sha }}

    steps:
      - name: Enforce main branch for production readiness
        working-directory: .
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Production readiness workflow must run from main branch. Current: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Ensure required secret is present
        run: |
          test -n "${PRIVATE_KEY}" || {
            echo "MARK_DEPLOYER_PRIVATE_KEY secret is required";
            exit 1;
          }

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0

      - name: Run mainnet readiness gate
        working-directory: contracts
        run: ./script/ops/mainnet-readiness.sh

      - name: Upload readiness artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mark-mainnet-readiness-artifact
          path: contracts/${{ inputs.artifact_path }}
          if-no-files-found: ignore
