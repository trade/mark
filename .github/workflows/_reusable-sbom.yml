name: Reusable SBOM

on:
  workflow_call:
    inputs:
      upload_artifact:
        description: 'Upload SBOM as artifact'
        required: false
        default: 'true'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  sbom:
    name: Generate SBOM
    if: ${{ inputs.upload_artifact == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.18.0 (verified tag commit)
        id: sbom
        with:
          format: cyclonedx-json
          output-file: sbom.json
          include-dev: true
          exclude: test/**,script/**,lib/**,out/**,cache/**,node_modules/**

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.18.0 (verified tag commit)
        id: sbom-spdx
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          include-dev: true
          exclude: test/**,script/**,lib/**,out/**,cache/**,node_modules/**

      - name: Upload SPDX SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx
          path: sbom.spdx.json