name: Governance
on:
  pull_request:
    paths:
      - 'scripts/github/apply-governance.sh'
      - 'docs/BRANCHING.md'
      - '.github/PRODUCTION_GOVERNANCE_CHECKLIST.md'
      - '.github/workflows/governance.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'scripts/github/apply-governance.sh'
      - 'docs/BRANCHING.md'
      - '.github/PRODUCTION_GOVERNANCE_CHECKLIST.md'
      - '.github/workflows/governance.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 1' # Weekly Monday 4:15am UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate-policy:
    name: Validate Governance Policy Consistency
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run governance policy validator
        run: bash scripts/ci/validate-governance-policy.sh

  verify-baseline:
    name: Verify Governance Baseline
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify governance protections
        env:
          GH_PAT: ${{ secrets.GOVERNANCE_VERIFY_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "${GH_PAT}" ]; then
            echo "Missing required secret: GOVERNANCE_VERIFY_PAT" >&2
            exit 1
          fi
          ./scripts/github/verify-governance.sh