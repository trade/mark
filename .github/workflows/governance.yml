# DEPRECATED: This workflow has been consolidated into security.yml
# Use .github/workflows/security.yml instead
# This file is kept for backwards compatibility but will be removed in a future update

name: Governance (DEPRECATED)
on:
  pull_request:
    paths:
      - 'scripts/github/apply-governance.sh'
      - 'docs/BRANCHING.md'
      - '.github/PRODUCTION_GOVERNANCE_CHECKLIST.md'
      - '.github/workflows/governance.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'scripts/github/apply-governance.sh'
      - 'docs/BRANCHING.md'
      - '.github/PRODUCTION_GOVERNANCE_CHECKLIST.md'
      - '.github/workflows/governance.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 1' # Weekly Monday 4:15am UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  deprecated-notice:
    name: Deprecated Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Deprecation Notice
        run: |
          echo "::warning::This workflow is deprecated. Governance validation is now part of the unified security.yml workflow."
          echo "::warning::Please update your branch protection rules and references to use security.yml instead."
