name: Semgrep Security Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep Security Scan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch baseline tag
        run: git fetch origin tag semgrep-baseline-v1 || true

      - name: Setup mise (for uv/semgrep)
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true

      - name: Run Semgrep with SARIF output (baseline-aware)
        run: |
          BASELINE_SHA=$(git rev-parse semgrep-baseline-v1^{commit} 2>/dev/null || echo "")
          if [ -n "$BASELINE_SHA" ]; then
            uvx semgrep@1.163.0 scan --config=.semgrep.yml --severity ERROR --error --sarif --output=semgrep.sarif --baseline-commit=$BASELINE_SHA .
          else
            uvx semgrep@1.163.0 scan --config=.semgrep.yml --severity ERROR --error --sarif --output=semgrep.sarif .
          fi
        env:
          SEMGREP_SEND_METRICS: "off"

      - name: Prepare empty SARIF if missing
        if: always()
        run: |
          if [ ! -f semgrep.sarif ]; then
            echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif
          fi

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep