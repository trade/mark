name: Reusable Frontend Checks

on:
  workflow_call:
    inputs:
      node_versions:
        description: JSON array of Node versions
        required: false
        default: '[ "24.3.0" ]'
        type: string
      pnpm_version:
        description: pnpm version used by corepack
        required: false
        default: '9.0.2'
        type: string

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend Checks (Node ${{ matrix.node }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node_versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ matrix.node }}
          pnpm-version: ${{ inputs.pnpm_version }}
          cache-key-suffix: frontend-${{ matrix.node }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm -s build:frontend