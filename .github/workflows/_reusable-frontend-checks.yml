name: Reusable Frontend Checks

on:
  workflow_call:
    inputs:
      node_versions:
        description: JSON array of Node versions
        required: false
        default: '[ "24.3.0" ]'
        type: string
      pnpm_version:
        description: pnpm version used by corepack
        required: false
        default: '9.0.2'
        type: string

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend Checks (Node ${{ matrix.node }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node_versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup persistent cache (Blacksmith)
        uses: useblacksmith/stickydisk@4c034ba57b706cf0e3b4b0ce098c2a3b1071580c
        with:
          path: |
            ~/.cache
            ~/.cargo
            ~/.foundry
            node_modules
            circuits/node_modules
            contracts/lib

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ matrix.node }}
          pnpm-version: ${{ inputs.pnpm_version }}
          cache-key-suffix: frontend-${{ matrix.node }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm -s build:frontend