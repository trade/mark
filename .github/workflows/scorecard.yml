# DEPRECATED: This workflow has been consolidated into security.yml
# Use .github/workflows/security.yml instead
# This file is kept for backwards compatibility but will be removed in a future update

# OpenSSF Scorecard
# https://github.com/ossf/scorecard-action
#
# Analyzes the security posture of this repository using the OpenSSF Scorecard.
# Results are posted as a PR comment and uploaded to the Security tab.
#
# This runs on pushes to dev/main and weekly on a schedule.
# It does NOT run on every PR to avoid noise -- the dependency-review workflow
# handles per-PR supply chain checks.

name: OpenSSF Scorecard (DEPRECATED)

on:
  push:
    branches: [dev, main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # Required for SARIF upload to GitHub Security tab
  id-token: write         # Required for OIDC token (result publishing)

jobs:
  deprecated-notice:
    name: Deprecated Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Deprecation Notice
        run: |
          echo "::warning::This workflow is deprecated. OpenSSF Scorecard is now part of the unified security.yml workflow."
          echo "::warning::Please update your branch protection rules and references to use security.yml instead."
