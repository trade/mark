# OpenSSF Scorecard
# https://github.com/ossf/scorecard-action
#
# Analyzes the security posture of this repository using the OpenSSF Scorecard.
# Publishes results to the OpenSSF project (public report + badge) and fails the
# job when the aggregate score drops below a minimum threshold.
# Runs on PRs to dev/main, pushes to dev/main, and weekly on a schedule.

name: OpenSSF Scorecard

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: OpenSSF Scorecard Analysis
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # Required for OIDC token (result publishing)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Single SHA-pinned invocation. Emit JSON (which carries the top-level
      # aggregate `score`) so the gate below can enforce a minimum. JSON is used
      # rather than SARIF because scorecard-action exposes no `threshold` input
      # and the SARIF output has no aggregate-score field. Running the action
      # only once avoids a second execution of its (vendor-controlled, mutably
      # tagged) container image. publish_results still publishes the public
      # OpenSSF report/badge for this repo.
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard-results.json
          results_format: json
          publish_results: true
          # Token is auto-generated via OIDC (id-token: write permission above)

      - name: Enforce minimum Scorecard score
        run: |
          # Minimum acceptable aggregate score (current ~6.4, target 7.0+ long-term).
          THRESHOLD=5.0
          SCORE=$(jq -r '.score // empty' scorecard-results.json)
          if [ -z "$SCORE" ] || [ "$SCORE" = "null" ]; then
            echo "::warning::Could not determine an aggregate Scorecard score; skipping the score gate."
            exit 0
          fi
          echo "OpenSSF Scorecard aggregate score: $SCORE (minimum required: $THRESHOLD)"
          # A negative score means Scorecard could not compute a result; don't hard-fail on it.
          if awk -v s="$SCORE" 'BEGIN { exit !(s < 0) }'; then
            echo "::warning::Scorecard returned an indeterminate score ($SCORE); skipping the score gate."
            exit 0
          fi
          if awk -v s="$SCORE" -v t="$THRESHOLD" 'BEGIN { exit !(s < t) }'; then
            echo "::error::OpenSSF Scorecard score $SCORE is below the required minimum of $THRESHOLD"
            exit 1
          fi
          echo "Scorecard score $SCORE meets the minimum threshold of $THRESHOLD."
