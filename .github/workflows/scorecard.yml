# OpenSSF Scorecard
# https://github.com/ossf/scorecard-action
#
# Analyzes the security posture of this repository using the OpenSSF Scorecard.
# Results are posted as a PR comment and uploaded to the Security tab.
# Runs on PRs to dev/main, pushes to dev/main, and weekly on a schedule.

name: OpenSSF Scorecard

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: OpenSSF Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write  # Required for SARIF upload to GitHub Security tab
      id-token: write         # Required for OIDC token (result publishing)
      pull-requests: write    # Required for PR comment on findings
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
          fail-on-severity: critical
          # Upload results to GitHub Security tab
          # Token is auto-generated via OIDC (id-token: write permission above)

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
