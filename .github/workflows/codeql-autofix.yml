name: CodeQL Autofix

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  autofix:
    name: CodeQL Autofix
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
      security-events: write
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis with Autofix
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: "/language:javascript-typescript"
          upload: true

      - name: Upload Autofix PR
        uses: github/codeql-action/autofix@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: CodeQL autofix for ${LANGUAGE}"
          branch-prefix: codeql-autofix-