name: Reusable Circuits Core

on:
  workflow_call:
    inputs:
      run_tests:
        description: 'Run circuit tests'
        required: false
        default: 'true'
        type: string
      run_circomspect:
        description: 'Run circomspect static analysis'
        required: false
        default: 'true'
        type: string
      check_changes:
        description: 'Check for circuit changes before running'
        required: false
        default: 'false'
        type: string
      base_ref:
        description: 'Base ref for change detection (e.g., refs/heads/main)'
        required: false
        type: string
      event_name:
        description: 'Event name for change detection logic'
        required: false
        type: string

jobs:
  circuits-core:
    name: Circuits Core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check for circuit changes
        id: check
        if: inputs.check_changes == 'true'
        env:
          BASE_REF: ${{ inputs.base_ref }}
          EVENT_NAME: ${{ inputs.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "schedule" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          BASE="origin/$BASE_REF"
          CHANGED=$(git diff --name-only "$BASE"...HEAD | grep -cE '\.(circom|js)$' || true)
          if [ "$CHANGED" -gt 0 ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "No circuit files changed, skipping circompect"
          fi

      - name: Setup mise
        if: inputs.check_changes != 'true' || steps.check.outputs.run == 'true'
        uses: jdx/mise-action@691e684984939740113c1a3ae421e8a58f5b33cb # v2.0.0
        with:
          install: true
          cache: true

      - name: Cache cargo
        if: inputs.check_changes != 'true' || steps.check.outputs.run == 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Setup toolchain
        if: inputs.check_changes != 'true' || steps.check.outputs.run == 'true'
        run: mise install

      - name: Install circom
        if: inputs.check_changes != 'true' || steps.check.outputs.run == 'true'
        run: |
          CIRCOM_VERSION="v2.2.3"
          curl -sSL "https://github.com/iden3/circom/releases/download/${CIRCOM_VERSION}/circom-linux-amd64" -o /tmp/circom
          echo '85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3  /tmp/circom' | sha256sum -c -
          sudo install -m 755 /tmp/circom /usr/local/bin/circom
          circom --version

      - name: Install dependencies
        if: inputs.check_changes != 'true' || steps.check.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Compile circuits
        if: inputs.check_changes != 'true' || steps.check.outputs.run == 'true'
        run: |
          cd circuits
          mkdir -p build
          pnpm run build

      - name: Run circuit tests
        if: (inputs.check_changes != 'true' || steps.check.outputs.run == 'true') && inputs.run_tests == 'true'
        run: |
          cd circuits
          pnpm test

      - name: Install circomspect
        if: (inputs.check_changes != 'true' || steps.check.outputs.run == 'true') && inputs.run_circomspect == 'true'
        run: cargo install circomspect --version 0.9.0 --locked
        env:
          CARGO_NET_RETRY: 2
          CARGO_HTTP_TIMEOUT: 30

      - name: Run circomspect
        if: (inputs.check_changes != 'true' || steps.check.outputs.run == 'true') && inputs.run_circomspect == 'true'
        working-directory: circuits
        run: |
          set -euo pipefail
          echo "Running circomspect static analysis..."
          circomspect . \
            -l ERROR \
            -L node_modules \
            --sarif-file ../circomspect.sarif \
            2>&1 | tee ../circomspect-output.log
          echo "Circomspect passed, no circuit vulnerabilities found"

      - name: Upload SARIF to GitHub Security
        if: (inputs.check_changes != 'true' || steps.check.outputs.run == 'true') && inputs.run_circomspect == 'true'
        uses: github/codeql-action/upload-sarif@51313611dfbc5bd21517390ab8e8517fd8363fb1 # v3.25.15
        with:
          sarif_file: circomspect.sarif
          category: circomspect