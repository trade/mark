name: Reusable Secrets Scan

on:
  workflow_call:
    secrets:
      GITLEAKS_LICENSE:
        required: false
        description: Gitleaks license key for org use

jobs:
  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@691e684984939740113c1a3ae421e8a58f5b33cb # v2.0.0
        with:
          install: true
          cache: true

      - name: Run gitleaks
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        run: |
          gitleaks detect --config .gitleaks.toml --redact --report-format sarif --report-path gitleaks.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@afb54ba388a7dca6ecae48f608c4ff05ff4cc77a # v3.25.15
        with:
          sarif_file: gitleaks.sarif
