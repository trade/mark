name: Scripts CI

on:
  pull_request:
    paths:
      - 'scripts/**/*.sh'
      - 'contracts/script/**/*.sh'
      - '.github/workflows/scripts-ci.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'scripts/**/*.sh'
      - 'contracts/script/**/*.sh'
      - '.github/workflows/scripts-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck Scripts
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: 'scripts contracts/script'

  shfmt:
    name: Shell Format (shfmt)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install shfmt
        run: |
          curl -sSL https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64 \
            -o /tmp/shfmt
          echo '1f57a384d59542f8fac5f503da1f3ea44242f46dff969569e80b524d64b71dbc  /tmp/shfmt' | sha256sum -c -
          install -m 755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      - name: Check shell formatting
        run: |
          shfmt -d -i 2 -ci scripts/ contracts/script/
