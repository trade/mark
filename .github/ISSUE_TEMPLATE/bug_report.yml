name: Bug Report
description: Report a bug in MARK Protocol
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Please fill out the sections below.
  
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Deploy contract to...
        2. Call function with...
        3. See error...
    validations:
      required: true
  
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  
  - type: input
    id: version
    attributes:
      label: Version
      description: Version or commit hash
      placeholder: "v0.1.0 or commit abc123"
    validations:
      required: true
  
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Smart Contracts
        - Frontend
        - CI/CD
        - Documentation
        - Other
    validations:
      required: true
