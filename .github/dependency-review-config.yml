# Dependency Review configuration
# https://github.com/actions/dependency-review-action#configuration
#
# This file is referenced by .github/workflows/dependency-review.yml
# via the config-file input.

# Fail on vulnerabilities of this severity or higher.
fail_on_severity: high

# Only fail on runtime dependencies (not dev tools).
fail_on_scopes:
  - runtime

# License check is enabled by default.
license_check: true

# Vulnerability check is enabled by default.
vulnerability_check: true

# Allowed licenses for dependencies.
# AGPL-3.0 and GPL-3.0 are permitted for dev tools (e.g. slither-analyzer)
# that analyze code but are not distributed as part of the product.
# Using an AGPL analysis tool on MIT-licensed code is not a license violation.
allow_licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - Unlicense
  - CC0-1.0
  - AGPL-3.0
  - GPL-2.0
  - GPL-3.0
  - LGPL-2.1
  - LGPL-3.0

# Deny-licenses is deprecated; use allow-licenses instead.
# deny_licenses: []

# Allow specific packages regardless of license (SHA-pinned GitHub Actions
# that the license scanner cannot resolve to a release tag).
# Format: pkg:ecosystem/name@version
allow_dependencies_licenses:
  - pkg:githubactions/github/codeql-action/upload-sarif
  - pkg:githubactions/jdx/mise-action

# GHSA IDs to allow (none currently).
allow_ghsas: []

# Packages to deny (none currently).
deny_packages: []

# Package groups/namespaces to deny (none currently).
deny_groups: []
