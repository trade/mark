# Dependency Review configuration
# https://github.com/actions/dependency-review-action#configuration
#
# This file is referenced by .github/workflows/dependency-review.yml
# via the config-file input.

# Fail on vulnerabilities of this severity or higher.
fail_on_severity: high

# Only fail on runtime dependencies (not dev tools).
fail_on_scopes:
  - runtime

# License check is enabled by default.
license_check: true

# Vulnerability check is enabled by default.
vulnerability_check: true

# Allowed licenses for dependencies.
# AGPL-3.0 is allowed for dev tools (slither-analyzer) that analyze code but do not
# become part of the distributed product. MIT-licensed project + AGPL analysis tool is
# not a license violation.
# LGPL-2.0/LGPL-2.1 is allowed for semgrep, which is a static analysis tool.
# Apache-2.0 WITH LLVM-exception is allowed for @bytecodealliance/preview2-shim (WASM tooling dep of prettier-plugin-solidity).
allow_licenses:
  - MIT
  - Apache-2.0
  - "Apache-2.0 WITH LLVM-exception"
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - Unlicense
  - CC0-1.0
  - CC-BY-4.0
  - BlueOak-1.0.0
  - AGPL-3.0
  - GPL-2.0
  - GPL-3.0
  - LGPL-2.0
  - LGPL-2.1
  - LGPL-2.0-only
  - LGPL-2.1-only
  - LGPL-3.0

# Deny-licenses is deprecated; use allow-licenses instead.
# deny_licenses: []

# Allow specific packages regardless of license (SHA-pinned GitHub Actions
# that the license scanner cannot resolve to a release tag).
# Format: pkg:ecosystem/name
allow_dependencies_licenses:
  - pkg:githubactions/github/codeql-action/upload-sarif
  - pkg:githubactions/jdx/mise-action
  - pkg:pypi/slither-analyzer
  - pkg:npm/actions/github-script
  - pkg:npm/supersim
  - pkg:npm/@solidity-parser/parser
  # Transitive dependencies of slither-analyzer, pulled in only by the
  # CI-only release-gate container (contracts/docker/slither-requirements.txt).
  # Like slither-analyzer itself, these are static-analysis tooling deps that
  # never become part of the distributed product. They are allow-listed by
  # package because the SPDX scanner flags their (often false-positive) AND
  # license expressions (PSF-2.0, GPL-1.0-or-later, MPL-2.0, CNRI-Python,
  # Unicode-TOU, public-domain), or cannot detect a license at all.
  - pkg:pypi/aiohappyeyeballs
  - pkg:pypi/aiohttp
  - pkg:pypi/bitarray
  - pkg:pypi/cbor2
  - pkg:pypi/certifi
  - pkg:pypi/idna
  - pkg:pypi/pycryptodome
  - pkg:pypi/pyunormalize
  - pkg:pypi/regex
  - pkg:pypi/solc-select
  - pkg:pypi/types-requests
  - pkg:pypi/typing-extensions
  - pkg:pypi/wcwidth

# GHSA IDs to allow (none currently).
allow_ghsas: []

# Packages to deny (none currently).
deny_packages: []

# Package groups/namespaces to deny (none currently).
deny_groups: []
