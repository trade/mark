name: Checkout with Retry
description: Checkout repository with automatic retry on failure

inputs:
  submodules:
    description: Whether to checkout submodules
    required: false
    default: 'recursive'
  fetch-depth:
    description: Number of commits to fetch
    required: false
    default: '0'
  clean:
    description: Whether to clean the repo on retry
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        submodules: ${{ inputs.submodules }}
        fetch-depth: ${{ inputs.fetch-depth }}
        token: ${{ github.token }}
        persist-credentials: true
      continue-on-error: true
      id: checkout-attempt-1

    - name: Retry checkout on failure
      if: steps.checkout-attempt-1.outcome == 'failure'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        submodules: ${{ inputs.submodules }}
        fetch-depth: ${{ inputs.fetch-depth }}
        token: ${{ github.token }}
        persist-credentials: true
        clean: ${{ inputs.clean }}
