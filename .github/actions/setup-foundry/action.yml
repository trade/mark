name: Setup Foundry

description: Setup Foundry toolchain with caching and pinned version.

inputs:
  version:
    description: Foundry version to install
    required: false
    default: '1.7.1'
  cache-key:
    description: Cache key suffix for foundry toolchain
    required: false
    default: foundry-${{ runner.os }}

runs:
  using: composite
  steps:
    - name: Setup Foundry
      uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0
      with:
        version: ${{ inputs.version }}
        cache: true
        cache-key: ${{ inputs.cache-key }}