name: Setup Foundry

description: Install pinned Foundry toolchain used by repository workflows.

inputs:
  foundry-version:
    description: Foundry version (for example 1.5.0 or nightly-<commit>)
    required: true

runs:
  using: composite
  steps:
    - name: Setup Foundry
      uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0
      with:
        version: ${{ inputs.foundry-version }}
