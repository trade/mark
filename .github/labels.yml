# Project labels — synced to GitHub via .github/workflows/labels.yml workflow.
# To add, rename, or remove a label: edit this file and merge to main.
# Colors use 6-digit hex without the # prefix.

labels:
  # Triage
  - name: triage
    color: 'e4e669'
    description: Needs triage before action can be taken

  # Type
  - name: bug
    color: 'd73a4a'
    description: Something isn't working
  - name: enhancement
    color: 'a2eeef'
    description: New feature or request
  - name: documentation
    color: '0075ca'
    description: Improvements or additions to documentation
  - name: security
    color: 'ee0701'
    description: Security vulnerability or hardening

  # Domain
  - name: contracts
    color: '5319e7'
    description: Smart contract changes
  - name: circuits
    color: '1d76db'
    description: ZK circuit changes
  - name: frontend
    color: '0052cc'
    description: Frontend changes
  - name: ci
    color: 'f9d0c4'
    description: CI/CD workflow changes

  # Dependencies
  - name: dependencies
    color: '0366d6'
    description: Dependency updates

  # Community
  - name: good first issue
    color: '7057ff'
    description: Good for newcomers
  - name: help wanted
    color: '008672'
    description: Extra attention is needed

  # Resolution
  - name: duplicate
    color: 'cfd3d7'
    description: This issue or pull request already exists
  - name: wontfix
    color: 'ffffff'
    description: This will not be worked on
  - name: invalid
    color: 'e4e669'
    description: This doesn't seem right
