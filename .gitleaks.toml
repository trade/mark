# Gitleaks configuration for MARK Protocol
# Excludes vendor directories and test data

title = "MARK Protocol Gitleaks Config"

[extend]
# Use default rules
useDefault = true

[allowlist]
# Exclude vendor/library directories
paths = [
  '''contracts\/lib\/''',
  '''circuits\/node_modules\/''',
  '''node_modules\/''',
  '''\.venv\/''',
  '''dist\/''',
  '''build\/''',
  '''\.git\/''',
  '''\.next\/''',
]

# Exclude test data files
regexes = [
  # Test vectors, example keys from OpenZeppelin
  '''3059301306072a8648ce3d020106082a8648ce3d030107034200''',
  '''keyDer''',
  # Example/test mnemonics and Foundry/Anvil defaults
  '''test test test test test test test test test test test junk''',
  # Anvil default accounts (known test keys)
  '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  # Example addresses in broadcast files (deployed contracts)
  '''0x5FbDB2315678afecb367f032d93F642f64180aa3''',
  '''0x68B1D87F95878fE05B998F19b66F4baba5De1aed''',
]

# Exclude specific commit SHAs if needed (for historical false positives)
# commits = []

# Exclude specific baseline fingerprints
# baseline-fingerprints = []