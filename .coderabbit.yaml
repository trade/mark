# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'en-US'
early_access: false

reviews:
  profile: 'assertive'
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  review_details: true
  fail_commit_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - 'WIP'
      - 'DO NOT REVIEW'
    ignore_usernames:
      - 'dependabot[bot]'
      - 'github-actions[bot]'
  path_filters:
    - 'contracts/src/**/*.sol'
    - 'contracts/script/**/*.sol'
    - 'contracts/test/**/*.sol'
    - 'circuits/**/*.circom'
    - 'src/**/*.ts'
    - 'src/**/*.tsx'
    - '.github/workflows/**'
    - '**/*.md'
    - '**/*.yml'
    - '**/*.yaml'
    - '**/*.toml'
    - '!**/.nvmrc'
    - '!**/pnpm-lock.yaml'
    - '!**/package-lock.json'
  path_instructions:
    - path: 'contracts/src/**/*.sol'
      instructions: |
        Focus only on: security vulnerabilities, reentrancy, CEI violations,
        access control issues, integer overflow/underflow, and incorrect error handling.
        Skip style, naming, and minor readability suggestions.
    - path: 'contracts/script/**/*.sol'
      instructions: |
        Focus only on: missing broadcast guards, hardcoded addresses or private keys,
        missing environment variable validation, and incorrect deployment ordering.
        Skip style suggestions.
    - path: 'contracts/test/**/*.sol'
      instructions: |
        Focus only on: missing test cases for security-critical paths, incorrect
        assertions that would pass on a broken implementation, and missing invariant
        checks. Skip style suggestions.
    - path: 'circuits/**/*.circom'
      instructions: |
        Focus only on: constraint soundness, missing range checks, and
        signal assignment correctness. Skip style suggestions.
    - path: 'src/**/*.ts'
      instructions: |
        Focus only on: incorrect ABI usage, misconfigured chain or transport settings,
        unsafe type assertions, and missing error handling on contract calls.
        Skip style suggestions.
    - path: 'src/**/*.tsx'
      instructions: |
        Focus only on: incorrect ABI usage, misconfigured chain or transport settings,
        unsafe type assertions, and missing error handling on contract calls.
        Skip style suggestions.
    - path: '.github/workflows/**'
      instructions: |
        Focus only on: secret exposure, injection vulnerabilities, unpinned action
        versions, missing permissions scoping, and missing branch enforcement.
        Skip style suggestions.
    - path: '**/*.md'
      instructions: |
        Focus on: broken links, incorrect commands, version mismatches,
        and structural issues (e.g., changelog format). Skip style suggestions.
    - path: '**/*.toml'
      instructions: |
        Focus on: invalid syntax, incorrect glob patterns, and configuration
        errors that would break builds. Skip style suggestions.
    - path: '**/*.yml'
      instructions: |
        Focus on: syntax errors, invalid job dependencies, and security issues.
        Skip style suggestions.

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - 'docs/CONTRIBUTING.md'
      - 'docs/ARCHITECTURE.md'
      - 'contracts/ARCHITECTURE.md'
