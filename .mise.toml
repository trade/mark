# .mise.toml – MARK Protocol toolchain
[env]
_.python.venv = { path = ".venv", create = true }
FOUNDRY_PROFILE = "ci"
OP_SEPOLIA_RPC = "https://sepolia.optimism.io"

[tools]
node = "24.3.0"
pnpm = "9.0.2"
foundry = "nightly"
python = "3.12"
uv = "0.5.4"
gitleaks = "8.30.1"
go = "1.22.5"
rust = "1.80.0"

[tasks]
ci-fast = "pnpm typecheck && pnpm lint && uvx semgrep scan --config=auto --config=.semgrep.yml --error && cd contracts && forge test --no-match-test invariant && cd ../circuits && pnpm run test:fast"