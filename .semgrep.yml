# Semgrep configuration for MARK Protocol
# https://semgrep.dev/docs/writing-rules/rule-syntax

rules:
  # === Solidity Security Rules ===

  # CRITICAL: State change after external call - double-spend race
  - id: mark-nullifier-after-external-call
    languages: [solidity]
    severity: ERROR
    message: |
      MARK-CRITICAL: State change after external call. Double-spend race.
      Fix: Set nullifierUsed before external call. See AGENTS.md
    metadata:
      cwe: "CWE-841: Improper Enforcement of Behavioral Workflow"
      owasp: "SC06: Reentrancy"
      category: "security"
    pattern-either:
      - pattern-inside: |
          $X.call(...);
          ...
          nullifierUsed[$Y] = true;
      - pattern-inside: |
          $X.delegatecall(...);
          ...
          nullifierUsed[$Y] = true;
      - pattern-inside: |
          $X.staticcall(...);
          ...
          nullifierUsed[$Y] = true;

  # CRITICAL: Bridge adapter must not mint - breaks trust model
  - id: mark-bridge-can-mint
    languages: [solidity]
    severity: ERROR
    message: "MARK-CRITICAL: Bridge adapter must not mint. Breaks trust model."
    metadata:
      cwe: "CWE-778: Insufficient Verification of Data Authenticity"
      owasp: "SC05: Missing Input Validation"
      category: "trust-model"
    pattern-either:
      - pattern: $TOKEN.mint(...)
      - pattern: $TOKEN.mintTo(...)
      - pattern: $TOKEN.safeMint(...)
      - pattern: _mint(...)
    paths:
      include:
        - '**/contracts/src/bridge/**'

  # HIGH: tx.origin usage breaks relayers/ERC-4337
  - id: mark-tx-origin-check
    languages: [solidity]
    severity: ERROR
    message: "MARK-HIGH: Breaks relayers/ERC-4337. Use msg.sender only."
    metadata:
      cwe: "CWE-477: Use of Obsolete Function"
      owasp: "SC06: Reentrancy"
      category: "authorization"
    pattern-either:
      - pattern: $X = tx.origin
      - pattern: $FUNC(..., tx.origin, ...)
      - pattern: return tx.origin
    paths:
      exclude:
        - '**/test/**'
        - '**/script/**'
        - '**/lib/**'

  # HIGH: block.timestamp in withdraw path breaks ZK proof determinism
  - id: mark-timestamp-in-withdraw
    languages: [solidity]
    severity: ERROR
    message: "MARK-HIGH: block.timestamp in withdraw path is nondeterministic. Breaks ZK proof."
    metadata:
      cwe: "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      owasp: "SC10: Weak Sources of Randomness"
      category: "determinism"
    pattern: block.timestamp
    paths:
      include:
        - '**/contracts/src/withdraw/**'

  # HIGH: Floating pragma - locks compiler version risk
  - id: mark-floating-pragma
    languages: [solidity]
    severity: WARNING
    message: "Floating pragma (^) locks compiler version. Pin exact version for reproducibility."
    metadata:
      cwe: "CWE-1104: Use of Unmaintained Third Party Components"
      owasp: "SC08: Dependency Vulnerabilities"
      category: "supply-chain"
    pattern: pragma solidity ^$V;

  # HIGH: Cross-function reentrancy - state change before external call in different functions
  - id: mark-cross-function-reentrancy
    languages: [solidity]
    severity: ERROR
    message: "MARK-HIGH: Cross-function reentrancy risk. External call before state update in another function."
    metadata:
      cwe: "CWE-841: Improper Enforcement of Behavioral Workflow"
      owasp: "SC06: Reentrancy"
      category: "security"
    pattern-either:
      - pattern: $X.call(...)
      - pattern: $X.transfer(...)
      - pattern: $X.send(...)
    pattern-not:
      - pattern: require($X.call(...))
      - pattern: assert($X.call(...))
      - pattern: ($OK, $DATA) = $X.call(...)
      - pattern: ($OK, ) = $X.call(...)
      - pattern: $OK = $X.call(...)
    paths:
      exclude:
        - '**/test/**'
        - '**/script/**'
        - '**/lib/**'

  # HIGH: Uninitialized storage pointer - struct assignment without storage keyword
  - id: mark-uninitialized-storage-pointer
    languages: [solidity]
    severity: ERROR
    message: "MARK-HIGH: Uninitialized storage pointer. Use 'storage' keyword or memory for struct copies."
    metadata:
      cwe: "CWE-823: Use of Out-of-range Pointer Offset"
      owasp: "SC06: Reentrancy"
      category: "memory-safety"
    pattern-either:
      - pattern-regex: "[A-Za-z_][A-Za-z0-9_]*\\s+[Ss]truct\\s+[A-Za-z_][A-Za-z0-9_]*\\s*="
      - pattern-regex: "[Ss]truct\\s+[A-Za-z_][A-Za-z0-9_]*\\s+[A-Za-z_][A-Za-z0-9_]*\\s*="
    paths:
      exclude:
        - '**/test/**'
        - '**/script/**'
        - '**/lib/**'

  # CRITICAL: State variable changes without events - observability gap
  - id: mark-missing-events
    languages: [solidity]
    severity: INFO
    message: "State variable change without event emission. Reduces observability."
    metadata:
      cwe: "CWE-778: Insufficient Verification of Data Authenticity"
      owasp: "SC09: Missing Events for State Changes"
      category: "observability"
    pattern-either:
      - pattern: $VAR = $VAL
      - pattern: $ARR[$IDX] = $VAL
      - pattern: $MAP[$KEY] = $VAL
    metavariable-regex:
      metavariable: $VAR
      regex: (owner|admin|paused|fee|whitelist|blacklist|minter|pauser|guardian|feeCollector|protocolFee|poolFee|markFee|settlementFee|depositFee|withdrawFee|bridgeFee|minDeposit|maxDeposit|minWithdraw|maxWithdraw|dailyLimit|epochDuration|rootHistoryLength|maxRootAge|merkleRoot|supportedChains|chainId|messenger|verifier|feePolicy|poolImplementation|withdrawImplementation|settlementImplementation)
    paths:
      exclude:
        - '**/test/**'
        - '**/script/**'
        - '**/lib/**'
        - '**/contracts/src/interfaces/**'

  # HIGH: Delegatecall to user-controlled address
  - id: mark-delegatecall-user-input
    languages: [solidity]
    severity: ERROR
    message: "Delegatecall to user-controlled address. Arbitrary execution risk."
    metadata:
      cwe: "CWE-94"
      owasp: "SC06"
      category: "code-execution"
    pattern: delegatecall($ADDR)
    paths:
      exclude:
        - '**/test/**'

  # MEDIUM: Selfdestruct usage - burn risk
  - id: mark-selfdestruct-usage
    languages: [solidity]
    severity: WARNING
    message: "Selfdestruct usage. Contract can be destroyed, funds at risk."
    metadata:
      cwe: "CWE-778"
      owasp: "SC06"
      category: "destruction"
    pattern: selfdestruct(...)

  # HIGH: Missing return value check on external call
  - id: mark-missing-return-check
    languages: [solidity]
    severity: ERROR
    message: "MARK-HIGH: External call return value not checked. Silent failure risk."
    metadata:
      cwe: "CWE-252: Unchecked Return Value"
      owasp: "SC06: Reentrancy"
      category: "error-handling"
    pattern-either:
      - pattern: $X.call(...)
      - pattern: $X.delegatecall(...)
      - pattern: $X.staticcall(...)
    pattern-not:
      - pattern: ($OK, $DATA) = $X.call(...)
      - pattern: ($OK, ) = $X.call(...)
      - pattern: $OK = $X.call(...)
      - pattern: require($X.call(...))
      - pattern: assert($X.call(...))
    paths:
      exclude:
        - '**/test/**'
        - '**/script/**'
        - '**/lib/**'

  # === TypeScript/JavaScript Security Rules ===

  # CRITICAL: Code injection via eval/Function constructor
  - id: ts-code-injection
    languages: [typescript, javascript]
    severity: ERROR
    message: "Code injection via eval/Function constructor. Use safe alternatives."
    metadata:
      cwe: "CWE-95"
      owasp: "A03: Injection"
      category: "code-execution"
    pattern-either:
      - pattern: eval($X)
      - pattern: new Function(...)

  # HIGH: Unsafe innerHTML - XSS risk
  - id: ts-unsafe-innerhtml
    languages: [typescript, javascript]
    severity: ERROR
    message: "Unsafe innerHTML assignment. XSS risk. Use textContent or sanitize."
    metadata:
      cwe: "CWE-79"
      owasp: "A03: Injection"
      category: "xss"
    pattern-either:
      - pattern: $EL.innerHTML = $X
      - pattern: $EL.outerHTML = $X
      - pattern: document.write($X)
      - pattern: document.writeln($X)

  # HIGH: prototype pollution (simplified - no metavariable-regex)
  - id: ts-prototype-pollution
    languages: [typescript, javascript]
    severity: ERROR
    message: "Potential prototype pollution. Validate keys before assignment."
    metadata:
      cwe: "CWE-915"
      owasp: "A03: Injection"
      category: "prototype-pollution"
    pattern-either:
      - pattern: $OBJ.__proto__ = $VAL
      - pattern: $OBJ.prototype = $VAL
      - pattern: $OBJ.constructor = $VAL
      - pattern: Object.assign($TARGET, ...)
      - pattern: Object.defineProperty($TARGET, $KEY, ...)

  # HIGH: Math.random for crypto - weak entropy
  - id: ts-weak-random
    languages: [typescript, javascript]
    severity: ERROR
    message: "Math.random() used for crypto. Use crypto.getRandomValues() instead."
    metadata:
      cwe: "CWE-338"
      owasp: "A02: Cryptographic Failures"
      category: "weak-crypto"
    pattern: Math.random()

  # MEDIUM: Path traversal
  - id: ts-path-traversal
    languages: [typescript, javascript]
    severity: WARNING
    message: "Potential path traversal. Validate and sanitize file paths."
    metadata:
      cwe: "CWE-22"
      owasp: "A01: Broken Access Control"
      category: "path-traversal"
    pattern-either:
      - pattern: fs.readFile($PATH, ...)
      - pattern: fs.writeFile($PATH, ...)
      - pattern: fs.unlink($PATH, ...)
      - pattern: require($PATH)
      - pattern: import($PATH)

  # HIGH: Insecure deserialization - JSON.parse with reviver, eval variants
  - id: ts-insecure-deserialization
    languages: [typescript, javascript]
    severity: ERROR
    message: "Insecure deserialization. Validate input before parsing."
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08: Software and Data Integrity Failures"
      category: "deserialization"
    pattern-either:
      - pattern: JSON.parse($X, $Y)
      - pattern: JSON.parse($X)
      - pattern-regex: "(JSON|yaml|YAML)\\.parse\\("
      - pattern: eval($X)
      - pattern: new Function(...)

  # HIGH: ReDoS - unsafe regex patterns
  - id: ts-redos
    languages: [typescript, javascript]
    severity: WARNING
    message: "Potential ReDoS. Avoid unbounded quantifiers in user-controlled regex."
    metadata:
      cwe: "CWE-1333: Inefficient Regular Expression Complexity"
      owasp: "A03: Injection"
      category: "redos"
    pattern-either:
      - pattern: new RegExp($X)
      - pattern-regex: "/.*(\\+|\\*).*\\{.*\\}.*/"
      - pattern: $STR.match($REGEX)
      - pattern: $STR.replace($REGEX, ...)
      - pattern: $STR.split($REGEX)

  # HIGH: Command injection - child_process with user input
  - id: ts-command-injection
    languages: [typescript, javascript]
    severity: ERROR
    message: "Command injection risk. Use execFile or spawn with array args."
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: "A03: Injection"
      category: "command-injection"
    pattern-either:
      - pattern: child_process.exec($X, ...)
      - pattern: child_process.execSync($X, ...)
      - pattern: child_process.spawn($X, ...)
      - pattern-regex: "child_process\\.spawn\\(.*\\$.*"
      - pattern: require('child_process').exec($X)
      - pattern: require('child_process').execSync($X)

  # HIGH: SQL injection - template strings in query
  - id: ts-sql-injection
    languages: [typescript, javascript]
    severity: ERROR
    message: "Potential SQL injection. Use parameterized queries."
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03: Injection"
      category: "sql-injection"
    pattern-either:
      - pattern: $DB.query(`$QUERY`)
      - pattern: $DB.execute(`$QUERY`)
      - pattern: $DB.prepare(`$QUERY`)
      - pattern: $DB.run(`$QUERY`)
      - pattern: $DB.all(`$QUERY`)
      - pattern: $DB.get(`$QUERY`)

  # MEDIUM: Insecure HTTP requests - HTTP instead of HTTPS
  - id: ts-insecure-http
    languages: [typescript, javascript]
    severity: WARNING
    message: "Insecure HTTP request. Use HTTPS."
    metadata:
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp: "A02: Cryptographic Failures"
      category: "insecure-transport"
    pattern-either:
      - pattern: fetch("http://$X", ...)
      - pattern: axios.get("http://$X", ...)
      - pattern: axios.post("http://$X", ...)
      - pattern: axios.put("http://$X", ...)
      - pattern: axios.delete("http://$X", ...)
      - pattern: fetch("http://$X")
      - pattern: axios("http://$X", ...)

  # HIGH: Missing input validation - direct use of req.body/req.query/req.params
  - id: ts-missing-validation
    languages: [typescript, javascript]
    severity: WARNING
    message: "Direct use of request input without validation. Validate/sanitize first."
    metadata:
      cwe: "CWE-20: Improper Input Validation"
      owasp: "A03: Injection"
      category: "input-validation"
    pattern-either:
      - pattern: $REQ.body.$PROP
      - pattern: $REQ.query.$PROP
      - pattern: $REQ.params.$PROP
    metavariable-regex:
      metavariable: $REQ
      regex: (req|request)

  # === General Secrets ===
  # Hardcoded private key - matches hex strings (0x...) with context
  - id: mark-hardcoded-private-key
    languages: [solidity, typescript, javascript]
    severity: ERROR
    message: "Possible hardcoded private key. Use env var instead."
    metadata:
      cwe: "CWE-798"
      owasp: "A02: Cryptographic Failures"
      category: "secrets"
    pattern-either:
      - pattern-regex: "(?i)(private|secret|key|mnemonic|seed|pwd|password|token|wallet|signer|sk|pk)\\s*[:=]\\s*[\"']?0x[a-fA-F0-9]{64}[\"']?"
      - pattern-regex: "(?i)(private|secret|key|mnemonic|seed|pwd|password|token|wallet|signer|sk|pk)\\s*[:=]\\s*[\"']?[a-fA-F0-9]{64}[\"']?"
    paths:
      exclude:
        - '**/tests/**'
        - '**/scripts/test/**'
        - '**/contracts/src/crypto/generated/**'
        - '**/test/**'
        - '**/scripts/test/**'
        - '**/lib/**'
        - '**/node_modules/**'
        - '**/contracts/src/crypto/generated/**'
        - '**/.semgrepignore'

  # === General Hardcoded API Keys ===
  - id: mark-hardcoded-api-key
    languages: [typescript, javascript, python, yaml, json, sol]
    severity: ERROR
    message: "Possible hardcoded API key/secret. Use environment variables."
    metadata:
      cwe: "CWE-798"
      owasp: "A02: Cryptographic Failures"
      category: "secrets"
    pattern-either:
      - pattern-regex: "(?i)(api[_-]?key|api[_-]?secret|access[_-]?token|auth[_-]?token|bearer[_-]?token|secret[_-]?key|private[_-]?key)\\s*[:=]\\s*[\"']?[a-zA-Z0-9_\\-]{20,}[\"']?"
      - pattern-regex: "(?i)(aws[_-]?access[_-]?key|aws[_-]?secret[_-]?key|ghp_[a-fA-Z0-9_]{36,}|github_pat_[a-fA-Z0-9_]{20,}|sk_live_[a-zA-Z0-9]{24,}|rk_live_[a-zA-Z0-9]{24,})"
    paths:
      exclude:
        - '**/tests/**'
        - '**/scripts/test/**'
        - '**/contracts/src/crypto/generated/**'
        - '**/test/**'
        - '**/scripts/test/**'
        - '**/lib/**'
        - '**/node_modules/**'
        - '**/contracts/src/crypto/generated/**'
        - '**/.semgrepignore'

  # === Lock File & Dependency Rules ===
  - id: mark-lockfile-integrity
    languages: [json, yaml]
    severity: WARNING
    message: "Lockfile should have integrity hashes for supply chain security"
    metadata:
      cwe: "CWE-1104"
      owasp: "A06: Vulnerable and Outdated Components"
      category: "supply-chain"
    pattern-either:
      - pattern: "package-lock.json"
      - pattern: "yarn.lock"
      - pattern: "pnpm-lock.yaml"
    paths:
      include:
        - '**/package-lock.json'
        - '**/yarn.lock'
        - '**/pnpm-lock.yaml'