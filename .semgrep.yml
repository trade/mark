# Semgrep configuration for MARK Protocol
# https://semgrep.dev/docs/writing-rules/rule-syntax

rules:
  # === Solidity Rules ===
  - id: mark-nullifier-after-external-call
    languages: [solidity]
    severity: ERROR
    message: |
      MARK-CRITICAL: State change after external call. Double-spend race.
      Fix: Set nullifierUsed before external call. See AGENTS.md
    pattern-either:
      - pattern-inside: |
          $X.call(...);
          ...
          nullifierUsed[$Y] = true;
      - pattern-inside: |
          $X.delegatecall(...);
          ...
          nullifierUsed[$Y] = true;
      - pattern-inside: |
          $X.staticcall(...);
          ...
          nullifierUsed[$Y] = true;

  - id: mark-bridge-can-mint
    languages: [solidity]
    severity: ERROR
    message: "MARK-CRITICAL: Bridge adapter must not mint. Breaks trust model."
    pattern: $TOKEN.mint(...);
    paths:
      include:
        - contracts/src/bridge/**

  - id: mark-tx-origin-check
    languages: [solidity]
    severity: ERROR
    message: "MARK-HIGH: Breaks relayers/ERC-4337. Use msg.sender only."
    pattern: tx.origin

  - id: mark-timestamp-in-withdraw
    languages: [solidity]
    severity: ERROR
    message: "MARK-HIGH: block.timestamp in withdraw path is nondeterministic. Breaks ZK proof."
    pattern: block.timestamp
    pattern-inside: |
      function withdraw(...) {
        ...
      }

  # === Circom Rules ===
  - id: mark-unconstrained-circom-signal
    languages: [circom]
    severity: ERROR
    message: "MARK-CRITICAL: Unconstrained signal. Silent exploit. Add constraint or remove signal."
    patterns:
      - pattern: signal input $X;
      - pattern-not: $X <== ...
      - pattern-not: $X === ...

  - id: mark-circom-var-for-witness
    languages: [circom]
    severity: WARNING
    message: "MARK-HIGH: Use 'signal' for witness data, not 'var'. Var is not constrained."
    pattern: var $X = ...;
    paths:
      - pattern-not: |
          $X;
      - pattern-not: |
          $X;
          ...
          // nosemgrep: mark-hardcoded-private-key - Poseidon matrix constants, not private keys
          $Y;
      - pattern-not: |
          $X;
          ...
          // nosemgrep: mark-hardcoded-private-key - Poseidon matrix constants, not private keys
          $Y;
          ...
          // nosemgrep: mark-hardcoded-private-key - Poseidon matrix constants, not private keys
          $Z;
      - pattern-not: |
          // nosemgrep: mark-hardcoded-private-key - Poseidon matrix constants, not private keys
          $X;
          $Y;
          $Z;
      - pattern-not: |
          contracts/src/crypto/generated/PoseidonT3.sol
  
  - id: mark-hardcoded-private-key
    languages: [solidity, typescript, javascript]
    severity: ERROR
    message: "MARK-CRITICAL: Possible hardcoded private key. Use env var."
    pattern-regex: '0x[a-fA-F0-9]{64}'
    pattern-not: 0x0000000000000000000000000000000000000000
    paths:
      exclude: [tests/**, scripts/test/**]
      include:
        - 'contracts/**/*.sol'
        - 'circuits/**/*.js'
        - 'circuits/**/*.ts'
        - 'src/**/*.js'
        - 'src/**/*.ts'
