pre-commit:
  parallel: true
  commands:
    typecheck:
      run: pnpm -s typecheck
    lint:
      run: pnpm -s lint
    gitleaks:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --verbose
        else
          echo "⚠️  gitleaks not found. Quick install:"
          echo "    bash scripts/install-gitleaks.sh"
          echo ""
          echo "    Skipping secrets scan (will run in CI)"
        fi

pre-push:
  commands:
    validate_workflows:
      run: |
        # Only validate if workflow or mise config files changed
        CHANGED=$(git diff --name-only @{push}..HEAD 2>/dev/null | grep -E '^\.github/workflows/|\.mise\.toml$' || true)
        if [ -z "$CHANGED" ]; then
          # Fallback for first push: check last commit only
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E '^\.github/workflows/|\.mise\.toml$' || true)
        fi
        if [ -n "$CHANGED" ]; then
          echo "Workflow files changed, running validation..."
          bash .github/scripts/validate-workflows.sh
        else
          echo "✓ No workflow changes, skipping validation"
        fi
      skip:
        - merge
        - rebase

post-merge:
  commands:
    mise_sync:
      run: |
        if command -v mise >/dev/null 2>&1; then
          # Only sync if .mise.toml changed in this merge
          CHANGED=$(git diff --name-only ORIG_HEAD HEAD 2>/dev/null | grep -c '\.mise\.toml$' || true)
          if [ "$CHANGED" -gt 0 ]; then
            echo "mise config changed, syncing tool versions..."
            mise install
          else
            echo "✓ No mise config changes"
          fi
        fi
