pre-commit:
  parallel: true
  commands:
    typecheck:
      run: pnpm -s typecheck
    lint:
      run: pnpm -s lint

pre-push:
  commands:
    coderabbit:
      run: |
        if [ "${SKIP_CODERABBIT:-}" != "1" ]; then
          echo "🤖 Running CodeRabbit review (set SKIP_CODERABBIT=1 to skip)..."
          coderabbit review --plain || true
        fi
