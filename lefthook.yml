pre-commit:
  parallel: true
  commands:
    typecheck:
      run: pnpm -s typecheck
    lint:
      run: pnpm -s lint
    gitleaks:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --verbose
        else
          echo "⚠️  gitleaks not found. Quick install:"
          echo "    bash scripts/install-gitleaks.sh"
          echo ""
          echo "    Skipping secrets scan (will run in CI)"
        fi

pre-push:
  commands:
    contracts_fast:
      run: |
        if [ "${SKIP_CONTRACTS_FAST:-}" != "1" ]; then
          echo "Running contracts fast checks (set SKIP_CONTRACTS_FAST=1 to skip)..."
          pnpm -s contracts:ci-fast
        fi
    coderabbit:
      run: |
        if [ "${SKIP_CODERABBIT:-}" != "1" ]; then
          echo "🤖 Running CodeRabbit review (set SKIP_CODERABBIT=1 to skip)..."
          coderabbit review --plain || true
        fi
